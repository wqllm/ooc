<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>简传记</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --topbar-bg: #e8dcc8;
            --bottombar-bg: #e8dcc8;
            --chat-bg: #f5f0e8;
            --bubble-other: #fff;
            --bubble-self: #c8e6c9;
            --text: #333;
            --text-light: #666;
            --border: #d5c8a8;
            --accent: #8b7355;
            --modal-bg: #fff;
            --input-bg: #fff;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
            --radius: 4px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --topbar-h: 52px;
            --bottombar-h: 50px;
            --night-overlay: 0;
        }
        .night-mode {
            --bg: #1a1a2e;
            --topbar-bg: #252538;
            --bottombar-bg: #252538;
            --chat-bg: #1a1a2e;
            --bubble-other: #2a2a40;
            --bubble-self: #1e3a2f;
            --text: #ddd;
            --text-light: #aaa;
            --border: #3a3a50;
            --accent: #b8a080;
            --modal-bg: #252538;
            --input-bg: #2a2a40;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --night-overlay: 0.35;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: var(--topbar-h);
            padding: 0 6px;
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
            gap: 2px;
        }
        #topbar .top-left,
        #topbar .top-right {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            flex-shrink: 0;
        }
        #topbar .top-left {
            flex: 0 1 auto;
            max-width: 28%;
        }
        #topbar .top-right {
            flex: 0 1 auto;
            max-width: 28%;
            flex-direction: row-reverse;
            text-align: right;
        }
        #topbar .top-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
            flex-wrap: nowrap;
            font-size: 11px;
        }
        #topbar .top-center span {
            cursor: pointer;
            padding: 4px 7px;
            border-radius: var(--radius);
            background: var(--input-bg);
            font-size: 10px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            border: 1px solid var(--border);
            transition: all 0.15s;
        }
        #topbar .top-center span:active {
            background: var(--accent);
            color: #fff;
        }
        .avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--border);
            flex-shrink: 0;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            overflow: hidden;
        }
        .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .nick-status {
            display: flex;
            flex-direction: column;
            min-width: 0;
            cursor: pointer;
        }
        .nick-status .nick {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            line-height: 1.3;
        }
        .nick-status .status {
            font-size: 10px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            line-height: 1.3;
        }
        #chat-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px 12px;
            background: var(--chat-bg);
            position: relative;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #chat-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, var(--night-overlay));
            pointer-events: none;
            z-index: 0;
        }
        #chat-area>* {
            position: relative;
            z-index: 1;
        }
        .msg-row {
            display: flex;
            margin: 6px 0;
            position: relative;
            align-items: flex-start;
            gap: 6px;
            flex-wrap: wrap;
            max-width: 100%;
        }
        .msg-row.self {
            flex-direction: row-reverse;
        }
        .msg-bubble {
            max-width: 72%;
            padding: 9px 13px;
            border-radius: 14px;
            word-break: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .msg-row.other .msg-bubble {
            background: var(--bubble-other);
            border-bottom-left-radius: 4px;
        }
        .msg-row.self .msg-bubble {
            background: var(--bubble-self);
            border-bottom-right-radius: 4px;
        }
        .msg-meta {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            width: 100%;
            padding: 0 4px;
        }
        .msg-row.self .msg-meta {
            justify-content: flex-end;
        }
        .msg-actions {
            display: none;
            position: absolute;
            top: -28px;
            background: var(--modal-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 8px;
            gap: 8px;
            font-size: 11px;
            z-index: 10;
            white-space: nowrap;
            box-shadow: var(--shadow);
            cursor: default;
        }
        .msg-row.self .msg-actions {
            right: 0;
        }
        .msg-row.other .msg-actions {
            left: 0;
        }
        .msg-row:hover .msg-actions,
        .msg-row .msg-actions.show {
            display: flex;
        }
        .msg-actions span {
            cursor: pointer;
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 2px;
        }
        .msg-actions span:active {
            background: var(--border);
        }
        .call-note {
            font-size: 10px;
            color: var(--text-light);
            text-align: center;
            width: 100%;
            padding: 3px 0;
            margin: 2px 0;
        }
        .sticker-img {
            width: 80px;
            height: 90px;
            object-fit: contain;
            border-radius: 6px;
            cursor: pointer;
        }
        #bottombar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            background: var(--bottombar-bg);
            border-top: 1px solid var(--border);
            z-index: 100;
            flex-shrink: 0;
            padding-bottom: calc(6px + var(--safe-bottom));
            flex-wrap: nowrap;
        }
        #bottombar button,
        #bottombar .bot-icon {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--input-bg);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: all 0.15s;
        }
        #bottombar button:active,
        #bottombar .bot-icon:active {
            background: var(--accent);
            color: #fff;
        }
        #msg-input {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            font-size: 14px;
            resize: none;
            outline: none;
            color: var(--text);
            max-height: 100px;
            line-height: 1.4;
            font-family: inherit;
        }
        #send-btn {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.15s;
        }
        #send-btn:active {
            opacity: 0.8;
            transform: scale(0.96);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.18s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-box {
            background: var(--modal-bg);
            border-radius: var(--radius);
            width: 92%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 16px;
            box-shadow: var(--shadow);
            position: relative;
            border: 1px solid var(--border);
        }
        .modal-box h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 16px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .modal-box .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-light);
            z-index: 5;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--input-bg);
        }
        .modal-box input[type="text"],
        .modal-box textarea {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            resize: vertical;
            min-height: 40px;
        }
        .modal-box textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-box button {
            padding: 8px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            margin: 4px;
            transition: all 0.15s;
        }
        .modal-box button:active {
            background: var(--accent);
            color: #fff;
        }
        .modal-box button.primary {
            background: var(--accent);
            color: #fff;
            border: none;
        }
        .row-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }
        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            border: 2px solid transparent;
            margin: 3px;
            transition: all 0.15s;
        }
        .color-dot:active,
        .color-dot.sel {
            border-color: var(--accent);
            transform: scale(1.15);
        }
        #music-mini {
            position: fixed;
            bottom: 80px;
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 180;
            font-size: 18px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
        }
        #call-mini {
            position: fixed;
            top: 60px;
            right: 10px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 180;
            font-size: 16px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
        }
        .password-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        .password-screen input {
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 16px;
            text-align: center;
            background: var(--input-bg);
            color: var(--text);
            width: 200px;
        }
        .password-screen button {
            padding: 10px 24px;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .chat-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            gap: 8px;
            transition: all 0.1s;
        }
        .chat-list-item:active {
            background: var(--border);
        }
        .chat-list-item .name {
            flex: 1;
            font-weight: 500;
            font-size: 14px;
        }
        .chat-list-item .del-btn {
            color: #c0392b;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="topbar">
            <div class="top-left">
                <div class="avatar-sm" id="other-avatar" title="点击设置对方头像">👤</div>
                <div class="nick-status">
                    <span class="nick" id="other-nick" title="点击设置对方昵称">对方</span>
                    <span class="status" id="other-status" title="点击设置对方状态">在线</span>
                </div>
            </div>
            <div class="top-center">
                <span id="btn-settings">设置</span>
                <span id="btn-newchat">新建聊天</span>
                <span id="btn-calendar">日历</span>
                <span id="btn-music">音乐</span>
                <span id="btn-xiaoliu">小六起卦</span>
                <span id="btn-favorites">⭐收藏</span>
            </div>
            <div class="top-right">
                <div class="avatar-sm" id="self-avatar" title="点击设置用户头像">🧑</div>
                <div class="nick-status" style="align-items:flex-end;">
                    <span class="nick" id="self-nick" title="点击设置用户昵称">我</span>
                    <span class="status" id="self-status" title="点击设置用户状态">在线</span>
                </div>
            </div>
        </div>
        <div id="chat-area"></div>
        <div id="bottombar">
            <button id="btn-call" title="电话">📞</button>
            <button id="btn-letters" title="信件中心">✉</button>
            <button id="btn-stickers" title="表情包">😊</button>
            <textarea id="msg-input" rows="1" placeholder="输入消息..."></textarea>
            <button id="btn-dots" title="让对方继续回复">⋯</button>
            <button id="send-btn">发送</button>
        </div>
    </div>
    <div id="music-mini" title="音乐播放中">🎵</div>
    <div id="call-mini" title="通话中">📞</div>
    <div id="modal-container"></div>
    <div id="password-screen" class="password-screen">
        <h3>🔒 简传记</h3>
        <input type="password" id="pwd-input" placeholder="请输入密码">
        <button id="pwd-submit">进入</button>
        <span style="font-size:11px;color:var(--text-light);">默认密码：123456</span>
    </div>
    <script>
        (function() {
            // ============ IndexedDB 封装 ============
            const DB_NAME = 'JianZhuanJi_DB';
            const DB_VER = 3;
            let db = null;

            function openDB() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = (e) => {
                        const d = e.target.result;
                        if (!d.objectStoreNames.contains('store'))
                            d.createObjectStore('store', { keyPath: 'id' });
                    };
                    req.onsuccess = (e) => { db = e.target.result;
                        resolve(db); };
                    req.onerror = (e) => reject(e);
                });
            }

            function dbGet(key) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('store', 'readonly');
                    const store = tx.objectStore('store');
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.data : null);
                    req.onerror = reject;
                });
            }

            function dbSet(key, data) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('store', 'readwrite');
                    const store = tx.objectStore('store');
                    store.put({ id: key, data: data });
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
            }

            function dbDel(key) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('store', 'readwrite');
                    const store = tx.objectStore('store');
                    store.delete(key);
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
            }
            // ============ 全局状态 ============
            const DEFAULT_PASSWORD = '123456';
            let APP_DATA = {
                password: DEFAULT_PASSWORD,
                passwordEnabled: true,
                chatInterfaces: [], // [{id, name, otherAvatar, otherNick, otherStatus, bgImage, bubbleStyle:'white-green'|'white-white'|'orange-orange', themeColor:'default', nightMode:false}]
                currentChatId: null,
                messages: {}, // chatId -> [{id,from:'self'|'other',type:'text'|'sticker'|'call',content,time,quoted:null,callDuration:null,callResult:null}]
                wordCards: [], // 字卡数组
                wordCardGroups: {}, // groupName -> [cardText]
                settings: {
                    replySpeed: 3, // 1-10秒
                    continuousReply: false,
                    maxContinuous: 5,
                    stickerReply: false,
                    soundType: 'dingding', // dingding|didi|wengweng
                    soundEnabled: true,
                },
                letters: [], // [{id,from:'other'|'self',content,time,replied:false,status:'sent'|'draft'|'received',chatId}]
                drafts: [], // 暂存信件
                stickers: [], // [{id,dataUrl}] base64
                musicList: [], // [{id,name,blobDataUrl}] 存储为base64 dataUrl
                musicBg: null,
                musicPlayMode: 'sequential', // sequential|single|random
                musicCurrentIndex: -1,
                musicIsPlaying: false,
                calendarMarks: {}, // year-month -> {marks:[days], cycleDays:7, cutoffDay:null}
                xiaoliuHistory: [], // [{question, input, result, time}]
                callActive: false,
                callStartTime: null,
                callTimer: null,
                callChatId: null,
                favorites: {}, // chatId -> [msgId]
            };

            function saveAll() {
                return dbSet('appData', APP_DATA);
            }

            function loadAll() {
                return dbGet('appData').then(data => {
                    if (data) {
                        APP_DATA = { ...APP_DATA, ...data };
                        if (!APP_DATA.messages) APP_DATA.messages = {};
                        if (!APP_DATA.favorites) APP_DATA.favorites = {};
                        if (!APP_DATA.letters) APP_DATA.letters = [];
                        if (!APP_DATA.drafts) APP_DATA.drafts = [];
                        if (!APP_DATA.stickers) APP_DATA.stickers = [];
                        if (!APP_DATA.musicList) APP_DATA.musicList = [];
                        if (!APP_DATA.calendarMarks) APP_DATA.calendarMarks = {};
                        if (!APP_DATA.xiaoliuHistory) APP_DATA.xiaoliuHistory = [];
                        if (!APP_DATA.wordCardGroups) APP_DATA.wordCardGroups = {};
                        if (!APP_DATA.chatInterfaces) APP_DATA.chatInterfaces = [];
                        if (APP_DATA.chatInterfaces.length === 0) {
                            APP_DATA.chatInterfaces.push(createDefaultChat());
                            APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
                        }
                        if (!APP_DATA.currentChatId && APP_DATA.chatInterfaces.length > 0) {
                            APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
                        }
                    } else {
                        APP_DATA.chatInterfaces = [createDefaultChat()];
                        APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
                        APP_DATA.messages = {};
                        APP_DATA.wordCards = ['你好呀', '今天过得怎么样？', '一切都会好起来的', '相信自己', '命运之轮在转动', '阳光总在风雨后',
                            '心想事成', '万事如意', '随遇而安', '珍惜当下'
                        ];
                        APP_DATA.settings = {
                            replySpeed: 3,
                            continuousReply: false,
                            maxContinuous: 5,
                            stickerReply: false,
                            soundType: 'dingding',
                            soundEnabled: true
                        };
                    }
                });
            }

            function createDefaultChat() {
                return {
                    id: 'chat_' + Date.now(),
                    name: '聊天1',
                    otherAvatar: '',
                    otherNick: '对方',
                    otherStatus: '在线',
                    bgImage: '',
                    bubbleStyle: 'white-green',
                    themeColor: 'default',
                    nightMode: false,
                };
            }

            function getCurrentChat() {
                return APP_DATA.chatInterfaces.find(c => c.id === APP_DATA.currentChatId) || APP_DATA
                    .chatInterfaces[0] || createDefaultChat();
            }

            function getMsgs(chatId) {
                if (!APP_DATA.messages[chatId]) APP_DATA.messages[chatId] = [];
                return APP_DATA.messages[chatId];
            }

            // ============ 塔罗牌算法（78张，正逆位） ============
            const TAROT_DECK = [
                // 大阿卡纳 22张
                { id: 0, name: '愚者', arcana: 'major', upright: '新的开始、冒险、纯真、 spontaneity', reversed: '鲁莽、风险、
                    考虑不周、天真 ' },
                { id: 1, name: '魔术师', arcana: 'major', upright: '创造力、技能、意志力、显化', reversed: '操纵、能力不足、
                    计划不周、滥用技巧 ' },

            function tarotDraw() {
                const idx = Math.floor(Math.random() * TAROT_DECK.length);
                const card = TAROT_DECK[idx];
                const isUpright = Math.random() > 0.5;
                return {
                    card: card.name,
                    arcana: card.arcana,
                    position: isUpright ? '正位' : '逆位',
                    meaning: isUpright ? card.upright : card.reversed,
                };
            }

            function tarotReply() {
                const draw = tarotDraw();
                // 占卜结果不显示，仅用于内部选择字卡
                const cards = APP_DATA.wordCards;
                if (cards.length === 0) return '（暂无字卡，请添加自定义回复）';
                const count = Math.min(Math.floor(Math.random() * 3) + 1, cards.length);
                const selected = [];
                const pool = [...cards];
                for (let i = 0; i < count; i++) {
                    const ri = Math.floor(Math.random() * pool.length);
                    selected.push(pool.splice(ri, 1)[0]);
                }
                return selected.join(' ');
            }

            // ============ 小六壬算法 ============
            const XIAOLIU_INDEX = ['大安', '留连', '速喜', '赤口', '小吉', '空亡'];
            const XIAOLIU_MEANING = {
                '大安': '大吉，事事昌盛，安稳平和。宜静不宜动，守成为上。',
                '留连': '中平，事难成就，纠缠不清。宜耐心等待，不宜急进。',
                '速喜': '大吉，喜事来临，快速达成。宜积极行动，把握时机。',
                '赤口': '凶，口舌是非，官非争斗。宜谨慎言行，避免冲突。',
                '小吉': '吉，凡事可成，小有收获。宜稳步推进，见好就收。',
                '空亡': '大凶，谋事落空，音信全无。宜保守静守，不宜妄动。',
            };

            function xiaoLiuRen(num1, num2, num3) {
                // 掌诀定位法
                const n1 = ((num1 - 1) % 6 + 6) % 6;
                const n2 = ((n1 + num2 - 1) % 6 + 6) % 6;
                const n3 = ((n2 + num3 - 1) % 6 + 6) % 6;
                const result = XIAOLIU_INDEX[n3];
                return { index: n3, name: result, meaning: XIAOLIU_MEANING[result], inputs: [num1, num2, num3] };
            }

            // ============ 字解法 ============
            function ziJieFa(char) {
                if (!char || char.length === 0) return { analysis: '请输入一个汉字' };
                const c = char[0];
                const code = c.charCodeAt(0);
                const strokes = Math.min((code % 30) + 1, 25);
                const wuxingMap = ['金', '木', '水', '火', '土'];
                const wuxing = wuxingMap[strokes % 5];
                const luckMap = ['吉', '中吉', '小吉', '平', '小凶', '凶'];
                const luck = luckMap[strokes % 6];
                const analysis = `汉字「${c}」：五行属${wuxing}，约${strokes}画，总体${luck}。${wuxing === '金'?'金主刚毅果断':wuxing==='木'?'木主生长仁德':wuxing==='水'?'水主智慧灵动':wuxing==='火'?'火主热情活力':'土主稳重诚信'}。`;
                return { char: c, strokes, wuxing, luck, analysis };
            }

            let audioCtx = null;

            function playSound(type) {
                if (!APP_DATA.settings.soundEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.value = 0.15;
                    if (type === 'dingding') { osc.frequency.value = 800;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); } else if (type ===
                        'didi') { osc.frequency.value = 600;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); } else if (type ===
                        'wengweng') { osc.frequency.value = 200;
                        osc.type = 'sawtooth';
                        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); }
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + (type === 'wengweng' ? 0.4 : type === 'didi' ? 0.15 : 0.25));
                } catch (e) {}
            }

            function formatTime(ts) {
                const d = new Date(ts);
                return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            }

            function quoteMsg(msg) {
                $msgInput.value = '「引用：' + (msg.content || '[表情]').substring(0, 30) + '」\n' + $msgInput.value;
                $msgInput.focus();

            function toggleFav(msg, chatId) {
                if (!APP_DATA.favorites[chatId]) APP_DATA.favorites[chatId] = [];
                const idx = APP_DATA.favorites[chatId].indexOf(msg.id);
                if (idx >= 0) APP_DATA.favorites[chatId].splice(idx, 1);
                else APP_DATA.favorites[chatId].push(msg.id);
                saveAll().then(renderChatArea);
            }

            function deleteMsg(msg, chatId) {
                const msgs = getMsgs(chatId);
                const idx = msgs.findIndex(m => m.id === msg.id);
                if (idx >= 0) { msgs.splice(idx, 1);
                    saveAll().then(renderChatArea); }
            }

            function addMessage(chatId, msg) {
                const msgs = getMsgs(chatId);
                msgs.push(msg);
                // 限制消息数量
                if (msgs.length > 2000) msgs.splice(0, 500);
                return saveAll();
            }

                const msg = {

                    from,
                    type: 'text',
                    content: text,
                    time: Date.now(),
                    quoted: null,

                return addMessage(chat.id, msg).then(() => {

                    playSound(APP_DATA.settings.soundType);
                    if (from === 'self') {
                        scheduleReply();
                    }
                });

            function scheduleReply() {
                const chat = getCurrentChat();
                const speed = APP_DATA.settings.replySpeed || 3;
                const delay = speed * 1000;

            function doReply(chatId) {
                const chat = APP_DATA.chatInterfaces.find(c => c.id === chatId);
                if (!chat || APP_DATA.currentChatId !== chatId) return;
                const replyText = tarotReply();
                const msg = {
                    id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    from: 'other',
                    type: 'text',
                    content: replyText,
                    time: Date.now(),
                    quoted: null,
                };
                addMessage(chatId, msg).then(() => {
                    if (APP_DATA.currentChatId === chatId) renderChatArea();
                    playSound(APP_DATA.settings.soundType);
                    if (APP_DATA.settings.continuousReply) {
                        const maxC = APP_DATA.settings.maxContinuous || 5;
                        const extra = Math.floor(Math.random() * maxC);
                        for (let i = 0; i < extra; i++) {
                            setTimeout(() => {
                                if (APP_DATA.currentChatId === chatId) {

                                    const m2 = {

                                        content: r2,
                                        time: Date.now(),
                                        quoted: null,
                                    };

                                            chatId) renderChatArea(); });
                                }
                            }, (i + 1) * (APP_DATA.settings.replySpeed || 3) * 1000);
                        }
                    }
                });
            }

            // ============ 日历 ============
            function showCalendar() {
                const now = new Date();
                const ym = now.getFullYear() + '-' + (now.getMonth() + 1);
                if (!APP_DATA.calendarMarks[ym]) APP_DATA.calendarMarks[ym] = { marks: [], cycleDays: 7, cutoffDay: null };
                const cm = APP_DATA.calendarMarks[ym];
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                let html = '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;">';
                for (let d = 1; d <= daysInMonth; d++) {
                    const marked = cm.marks.includes(d);
                    const cut = cm.cutoffDay && d > cm.cutoffDay;
                    html +=
                        `<span style="display:inline-block;width:28px;height:28px;text-align:center;line-height:28px;cursor:pointer;border-radius:2px;font-size:11px;${marked?'background:#e91e63;color:#fff;':cut?'background:#ddd;':'background:var(--input-bg);'}border:1px solid var(--border);" data-day="${d}">${d}</span>`;
                }
                html += '</div>';
                html +=
                    `<div class="row-btns" style="margin-top:8px;"><button id="cal-add">添加月经(${cm.cycleDays}天)</button><button id="cal-cycle">周期管理</button><button id="cal-del">删除此月</button><button id="cal-cutoff">截止日期</button></div>`;
                const modal = showModal('日历 - ' + ym, html);
                modal.box.querySelectorAll('[data-day]').forEach(sp => {
                    sp.addEventListener('click', function() {
                        const day = parseInt(this.getAttribute('data-day'));
                        if (cm.marks.includes(day)) {
                            cm.marks = cm.marks.filter(d => d !== day);
                        } else {
                            cm.marks.push(day);
                            for (let i = 1; i < cm.cycleDays; i++) {
                                const nd = day + i;
                                if (nd <= daysInMonth && !cm.marks.includes(nd)) cm.marks.push(
                                    nd);
                            }
                        }
                        cm.marks.sort((a, b) => a - b);
                        saveAll().then(() => { closeAllModals();
                            showCalendar(); });
                    });
                });
                modal.box.querySelector('#cal-add').addEventListener('click', () => {
                    const d = parseInt(prompt('输入日期(1-' + daysInMonth + ')：'));
                    if (d >= 1 && d <= daysInMonth) {
                        if (!cm.marks.includes(d)) cm.marks.push(d);
                        for (let i = 1; i < cm.cycleDays; i++) { const nd = d + i; if (nd <= daysInMonth && !cm
                                .marks.includes(nd)) cm.marks.push(nd); }
                        cm.marks.sort((a, b) => a - b);
                        saveAll().then(() => { closeAllModals();
                            showCalendar(); });
                    }
                });
                modal.box.querySelector('#cal-cycle').addEventListener('click', () => {
                    const cy = parseInt(prompt('周期天数(1-15)：', cm.cycleDays));
                    if (cy >= 1 && cy <= 15) { cm.cycleDays = cy;
                        saveAll().then(() => { closeAllModals();
                            showCalendar(); }); }
                });
                modal.box.querySelector('#cal-del').addEventListener('click', () => {
                    if (confirm('删除当月所有标记？')) { cm.marks = [];
                        saveAll().then(() => { closeAllModals();
                            showCalendar(); }); }
                });
                modal.box.querySelector('#cal-cutoff').addEventListener('click', () => {
                    const cd = parseInt(prompt('截止日期(1-' + daysInMonth + ')：', cm.cutoffDay || ''));
                    if (cd >= 1 && cd <= daysInMonth) { cm.cutoffDay = cd;
                        saveAll().then(() => { closeAllModals();
                            showCalendar(); }); }
                });
            }

            // ============ 音乐播放器 ============
            let musicAudio = null;
            let musicCurrentSrc = null;

            function getMusicAudio() {
                if (!musicAudio) {
                    musicAudio = new Audio();
                    musicAudio.preload = 'auto';
                    musicAudio.addEventListener('ended', () => {
                        playNextMusic();
                    });
                    musicAudio.addEventListener('error', () => {
                        console.log('音乐加载失败，尝试下一曲');
                        playNextMusic();
                    });
                }
                return musicAudio;
            }

            function playMusicIndex(index) {
                if (APP_DATA.musicList.length === 0) return;
                const audio = getMusicAudio();
                if (index < 0) index = APP_DATA.musicList.length - 1;
                if (index >= APP_DATA.musicList.length) index = 0;
                APP_DATA.musicCurrentIndex = index;
                const track = APP_DATA.musicList[index];
                musicCurrentSrc = track.blobDataUrl;
                audio.src = musicCurrentSrc;
                audio.load();
                audio.play().then(() => {
                    APP_DATA.musicIsPlaying = true;
                    updateMusicMini();
                }).catch(e => {
                    console.log('播放失败:', e);
                    APP_DATA.musicIsPlaying = false;
                    updateMusicMini();
                });
                saveAll();
            }

            function playNextMusic() {
                if (APP_DATA.musicList.length === 0) return;
                const mode = APP_DATA.musicPlayMode;
                let nextIdx = APP_DATA.musicCurrentIndex;
                if (mode === 'sequential') nextIdx++;
                else if (mode === 'random') nextIdx = Math.floor(Math.random() * APP_DATA.musicList.length);
                else if (mode === 'single') { playMusicIndex(nextIdx); return; }
                playMusicIndex(nextIdx);
            }

            function updateMusicMini() {
                if (APP_DATA.musicIsPlaying && APP_DATA.musicList.length > 0) {
                    $musicMini.style.display = 'flex';
                    const track = APP_DATA.musicList[APP_DATA.musicCurrentIndex] || APP_DATA.musicList[0];
                    $musicMini.title = '正在播放：' + (track ? track.name : '未知');
                } else {
                    $musicMini.style.display = 'none';
                }
            }

            function showMusicPlayer() {
                const track = APP_DATA.musicList[APP_DATA.musicCurrentIndex] || null;
                let html = `
            <p style="text-align:center;font-weight:600;">${track?track.name:'未在播放'}</p>
            <div class="row-btns">
              <button id="mu-prev">⏮</button>
              <button id="mu-play">${APP_DATA.musicIsPlaying?'⏸':'▶'}</button>
              <button id="mu-next">⏭</button>
              <button id="mu-mode">${APP_DATA.musicPlayMode==='sequential'?'🔁顺序':APP_DATA.musicPlayMode==='single'?'🔂单曲':'🔀随机'}</button>
            </div>
            <div class="row-btns" style="margin-top:8px;">
              <button id="mu-add">添加歌曲</button>
              <button id="mu-album">相册(背景)</button>
              <button id="mu-list">列表</button>
            </div>`;
                const modal = showModal('音乐', html);
                modal.box.querySelector('#mu-prev').addEventListener('click', () => {
                    playMusicIndex(APP_DATA.musicCurrentIndex - 1);
                    closeAllModals();
                    showMusicPlayer();
                });
                modal.box.querySelector('#mu-play').addEventListener('click', () => {
                    const audio = getMusicAudio();
                    if (APP_DATA.musicIsPlaying) { audio.pause();
                        APP_DATA.musicIsPlaying = false; } else { audio.play().catch(() => {});
                        APP_DATA.musicIsPlaying = true; }
                    updateMusicMini();
                    saveAll();
                    closeAllModals();
                    showMusicPlayer();
                });
                modal.box.querySelector('#mu-next').addEventListener('click', () => {
                    playNextMusic();
                    closeAllModals();
                    showMusicPlayer();
                });
                modal.box.querySelector('#mu-mode').addEventListener('click', () => {
                    const modes = ['sequential', 'single', 'random'];
                    const idx = modes.indexOf(APP_DATA.musicPlayMode);
                    APP_DATA.musicPlayMode = modes[(idx + 1) % 3];
                    saveAll();
                    closeAllModals();
                    showMusicPlayer();
                });
                modal.box.querySelector('#mu-add').addEventListener('click', () => {
                    const inp = document.createElement('input');
                    inp.type = 'file';
                    inp.accept = 'audio/*';
                    inp.multiple = true;
                    inp.onchange = (e) => {
                        const files = Array.from(e.target.files);
                        let processed = 0;
                        files.forEach(file => {
                            const reader = new FileReader();
                            reader.onload = () => {
                                APP_DATA.musicList.push({ id: 'mu_' + Date.now() + '_' + Math
                                        .random().toString(36).substr(2, 4),
                                    name: file.name, blobDataUrl: reader.result });
                                processed++;
                                if (processed === files.length) {
                                    saveAll().then(() => { closeAllModals();
                                        showMusicPlayer(); });
                                }
                            };
                            reader.readAsDataURL(file);
                        });
                        if (files.length === 0) { closeAllModals();
                            showMusicPlayer(); }
                    };
                    inp.click();
                });
                modal.box.querySelector('#mu-album').addEventListener('click', () => {
                    const inp = document.createElement('input');
                    inp.type = 'file';
                    inp.accept = 'image/*';
                    inp.onchange = (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = () => {
                                APP_DATA.musicBg = reader.result;
                                saveAll().then(() => { closeAllModals();
                                    showMusicPlayer(); });
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    inp.click();
                });
                modal.box.querySelector('#mu-list').addEventListener('click', () => {
                    closeAllModals();
                    showMusicList();
                });

            // ============ 电话 ============
            function makeCall() {
                if (APP_DATA.callActive) return;
                const chat = getCurrentChat();
                APP_DATA.callActive = true;
                APP_DATA.callChatId = chat.id;
                APP_DATA.callStartTime = Date.now();
                let callHtml = `
            <div style="text-align:center;">
              <div class="avatar-sm" style="width:60px;height:60px;margin:0 auto;">${chat.otherAvatar?`<img src="${chat.otherAvatar}" style="width:100%;height:100%;object-fit:cover;">`:'👤'}</div>

              <p id="call-status">拨号中...</p>
              <p id="call-timer" style="font-size:20px;">00:00</p>
              <div class="row-btns">
                <button id="call-hangup" style="background:#e74c3c;color:#fff;">挂断</button>
                <button id="call-minimize">缩小</button>
              </div>
            </div>`;
                const modal = showModal('电话', callHtml);
                const callStatus = modal.box.querySelector('#call-status');
                const callTimer = modal.box.querySelector('#call-timer');
                let answered = false;
                let callEnded = false;
                // 系统随机决定接听
                const sysAnswer = Math.random() > 0.3;
                const answerDelay = Math.floor(Math.random() * 25000) + 3000;
                let answerTimeout;
                if (sysAnswer && answerDelay < 28000) {
                    answerTimeout = setTimeout(() => {
                        if (callEnded) return;
                        answered = true;
                        callStatus.textContent = '已接通';
                        APP_DATA.callStartTime = Date.now();
                        startCallTimer(callTimer);
                    }, answerDelay);
                }
                const hangupTimeout = setTimeout(() => {
                    if (!answered && !callEnded) {
                        endCall('对方未接听', null);
                    }
                }, 30000);

                function startCallTimer(timerEl) {
                    APP_DATA.callTimer = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - APP_DATA.callStartTime) / 1000);
                        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                        const secs = (elapsed % 60).toString().padStart(2, '0');
                        timerEl.textContent = mins + ':' + secs;
                    }, 500);
                }

                function endCall(result, duration) {
                    callEnded = true;
                    APP_DATA.callActive = false;
                    clearTimeout(answerTimeout);
                    clearTimeout(hangupTimeout);
                    if (APP_DATA.callTimer) { clearInterval(APP_DATA.callTimer);
                        APP_DATA.callTimer = null; }
                    closeAllModals();
                    $callMini.style.display = 'none';
                    const callMsg = {
                        id: 'msg_' + Date.now() + '_call',
                        from: 'system',
                        type: 'call',
                        content: '',
                        time: Date.now(),
                        quoted: null,
                        callResult: result,
                        callDuration: duration || null,
                    };
                    addMessage(APP_DATA.callChatId || APP_DATA.currentChatId, callMsg).then(() => renderChatArea());
                }
                modal.box.querySelector('#call-hangup').addEventListener('click', () => {
                    if (answered) {
                        const elapsed = Math.floor((Date.now() - APP_DATA.callStartTime) / 1000);
                        const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                        const secs = (elapsed % 60).toString().padStart(2, '0');
                        endCall('通话', mins + ':' + secs);
                    } else {
                        endCall('已拒绝', null);
                    }
                });
                modal.box.querySelector('#call-minimize').addEventListener('click', () => {
                    $callMini.style.display = 'flex';
                    closeAllModals();
                });
                $callMini.addEventListener('click', () => {
                    if (APP_DATA.callActive) {
                        $callMini.style.display = 'none';
                        makeCall(); // 重新打开大窗口
                    }
                });
            }

                    saveAll().then(() => {
                        if (APP_DATA.currentChatId === chat.id) renderTopbar();
                        scheduleStatusRefresh();
                    });
                }, delay);
            }

            // ============ 密码保护 ============
            function checkPassword() {
                if (APP_DATA.passwordEnabled) {
                    $pwdScreen.style.display = 'flex';
                    $app.style.display = 'none';
                } else {
                    $pwdScreen.style.display = 'none';
                    $app.style.display = 'flex';
                }
            }
            document.getElementById('pwd-submit').addEventListener('click', () => {
                const pwd = $pwdInput.value.trim();
                if (pwd === APP_DATA.password) {
                    $pwdScreen.style.display = 'none';
                    $app.style.display = 'flex';
                    $pwdInput.value = '';
                } else {
                    alert('密码错误');
                }
            });
            $pwdInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('pwd-submit').click();
            });

            // ============ 事件绑定 ============
            document.getElementById('other-avatar').addEventListener('click', () => {
                const inp = document.createElement('input');
                inp.type = 'file';
                inp.accept = 'image/*';
                inp.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const chat = getCurrentChat();
                            chat.otherAvatar = reader.result;
                            saveAll().then(() => renderTopbar());
                        };
                        reader.readAsDataURL(file);
                    }
                };
                inp.click();
            });
            document.getElementById('other-nick').addEventListener('click', () => {
                const chat = getCurrentChat();
                const nn = prompt('输入对方昵称：', chat.otherNick);
                if (nn !== null) { chat.otherNick = nn.trim();
                    saveAll().then(() => renderTopbar()); }
            });
            document.getElementById('other-status').addEventListener('click', () => {
                const chat = getCurrentChat();
                const st = prompt('输入对方状态（一行一条，随机显示）：', chat.otherStatus);
                if (st !== null) { chat.otherStatus = st.trim().split('\n')[0] || '在线';
                    saveAll().then(() => renderTopbar()); }
            });
            document.getElementById('self-avatar').addEventListener('click', () => {
                const inp = document.createElement('input');
                inp.type = 'file';
                inp.accept = 'image/*';
                inp.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = () => {
                            if (APP_DATA.chatInterfaces.length > 0) {
                                APP_DATA.chatInterfaces[0].selfAvatar = reader.result;
                                saveAll().then(() => renderTopbar());
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                };
                inp.click();
            });
            document.getElementById('self-nick').addEventListener('click', () => {
                const nn = prompt('输入用户昵称：', (APP_DATA.chatInterfaces.length > 0 ? APP_DATA.chatInterfaces[0]
                    .selfNick : null) || '我');
                if (nn !== null && APP_DATA.chatInterfaces.length > 0) {
                    APP_DATA.chatInterfaces[0].selfNick = nn.trim();
                    saveAll().then(() => renderTopbar());
                }
            });
            document.getElementById('self-status').addEventListener('click', () => {
                const st = prompt('输入用户状态：', (APP_DATA.chatInterfaces.length > 0 ? APP_DATA.chatInterfaces[0]
                    .selfStatus : null) || '在线');
                if (st !== null && APP_DATA.chatInterfaces.length > 0) {
                    APP_DATA.chatInterfaces[0].selfStatus = st.trim();
                    saveAll().then(() => renderTopbar());
                }
            });
            document.getElementById('btn-settings').addEventListener('click', showSettings);
            document.getElementById('btn-newchat').addEventListener('click', showChatManager);
            document.getElementById('btn-calendar').addEventListener('click', showCalendar);
            document.getElementById('btn-music').addEventListener('click', showMusicPlayer);
            document.getElementById('btn-xiaoliu').addEventListener('click', showXiaoLiu);
            document.getElementById('btn-favorites').addEventListener('click', showFavorites);
            document.getElementById('btn-call').addEventListener('click', makeCall);
            document.getElementById('btn-letters').addEventListener('click', showLetters);
            document.getElementById('btn-stickers').addEventListener('click', showStickers);
            document.getElementById('btn-dots').addEventListener('click', triggerContinueReply);
            document.getElementById('send-btn').addEventListener('click', () => {
                const text = $msgInput.value.trim();
                if (text) {
                    sendTextMessage(text, 'self');
                    $msgInput.value = '';
                    $msgInput.style.height = 'auto';
                }
            });
            $msgInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('send-btn').click();
                }
            });
            $msgInput.addEventListener('input', () => {
                $msgInput.style.height = 'auto';
                $msgInput.style.height = Math.min($msgInput.scrollHeight, 100) + 'px';
            });
            $musicMini.addEventListener('click', () => {
                showMusicPlayer();
            });

            // 模拟随机来电
            function scheduleRandomCall() {
                const delay = Math.floor(Math.random() * 1800000) + 600000; // 10-40分钟
                setTimeout(() => {
                    if (!APP_DATA.callActive && document.hidden === false) {
                        simulateIncomingCall();
                    }
                    scheduleRandomCall();
                }, delay);
            }

            // ============ 初始化 ============
            function renderAll() {
                renderTopbar();
                renderChatArea();
                updateMusicMini();
                if (APP_DATA.callActive) $callMini.style.display = 'flex';
                else $callMini.style.display = 'none';
            }

            function init() {
                openDB().then(() => loadAll()).then(() => {
                    checkPassword();
                    renderAll();
                    scheduleStatusRefresh();
                    scheduleRandomCall();
                    // 恢复音乐播放状态
                    if (APP_DATA.musicIsPlaying && APP_DATA.musicList.length > 0) {
                        const audio = getMusicAudio();
                        const track = APP_DATA.musicList[APP_DATA.musicCurrentIndex] || APP_DATA.musicList[
                            0];
                        if (track && track.blobDataUrl) {
                            musicCurrentSrc = track.blobDataUrl;
                            audio.src = musicCurrentSrc;
                            audio.load();
                            audio.play().catch(() => { APP_DATA.musicIsPlaying = false; });
                        }
                        updateMusicMini();
                    }
                }).catch(err => {
                    console.error('初始化失败', err);
                    // 降级使用localStorage
                    try {
                        const saved = localStorage.getItem('jzj_backup');
                        if (saved) APP_DATA = JSON.parse(saved);
                    } catch (e2) {}
                    APP_DATA.chatInterfaces = APP_DATA.chatInterfaces || [createDefaultChat()];
                    APP_DATA.currentChatId = APP_DATA.currentChatId || APP_DATA.chatInterfaces[0].id;
                    APP_DATA.messages = APP_DATA.messages || {};
                    APP_DATA.wordCards = APP_DATA.wordCards || ['你好呀', '今天过得怎么样？', '一切都会好起来的'];
                    checkPassword();
                    renderAll();
                });
                // 定期保存
                setInterval(() => {
                    saveAll().catch(() => {
                        try { localStorage.setItem('jzj_backup', JSON.stringify(APP_DATA)); } catch (
                        e) {}
                    });
                }, 5000);
                // 页面卸载时保存
                window.addEventListener('beforeunload', () => {
                    saveAll().catch(() => {
                        try { localStorage.setItem('jzj_backup', JSON.stringify(APP_DATA)); } catch (
                        e) {}
                    });
                });
            }

            // 处理viewport变化（键盘弹出）
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const vh = window.visualViewport.height;
                    const diff = window.innerHeight - vh;
                    if (diff > 100) {
                        document.getElementById('bottombar').style.transform = `translateY(-${diff}px)`;
                    } else {
                        document.getElementById('bottombar').style.transform = '';
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
