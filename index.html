<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>简传记</title>
    <style>
        :root {
            --bg: #f5f1e8;
            --panel-bg: #faf7f0;
            --text: #3e2f1c;
            --accent: #8b5e3c;
            --accent2: #c9a87c;
            --gold: #b8860b;
            --bubble-user: #d4e8c2;
            --bubble-other: #fff;
            --bubble-user2: #fff;
            --bubble-other2: #ffe0c0;
            --night-bg: #1a1a2e;
            --night-panel: #252540;
            --night-text: #d0c8b8;
            --font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --chat-bg: #e8dcc8;
            --header-h: 56px;
            --footer-h: 52px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --modal-z: 1000;
            --popup-z: 900;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: #2c2416;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #app-container {
            width: 100%;
            max-width: 460px;
            height: 100vh;
            max-height: 880px;
            background: var(--bg);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }
        @media (min-width: 461px) {
            #app-container {
                border-radius: 20px;
                height: 92vh;
                max-height: 880px;
            }
        }
        .night-mode {
            --bg: #1a1a2e;
            --panel-bg: #252540;
            --text: #d0c8b8;
            --chat-bg: #1f1f35;
            --bubble-user: #2a3a2a;
            --bubble-other: #2a2a3a;
            --bubble-user2: #2a2a3a;
            --bubble-other2: #3a2a1a;
        }
        .night-mode #app-container {
            background: #1a1a2e;
        }
        /* Header */
        #header-bar {
            height: var(--header-h);
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #ddd8;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            gap: 2px;
        }
        #header-bar>div {
            display: flex;
            align-items: center;
        }
        .header-left {
            flex: 1;
            min-width: 0;
            gap: 6px;
            justify-content: flex-start;
        }
        .header-center {
            flex: 0 0 auto;
            gap: 3px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 180px;
        }
        .header-right {
            flex: 1;
            min-width: 0;
            gap: 6px;
            justify-content: flex-end;
            flex-direction: row-reverse;
        }
        .avatar-sm {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--accent2);
            flex-shrink: 0;
            background: #ddd;
        }
        .avatar-sm.self-av {
            border-color: #7baF7b;
        }
        .info-stack {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            line-height: 1.3;
            cursor: pointer;
            min-width: 0;
            max-width: 80px;
        }
        .info-stack .nick {
            font-weight: 700;
            color: var(--text);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info-stack .status {
            color: #999;
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-right .info-stack {
            text-align: right;
            align-items: flex-end;
        }
        .header-left .info-stack {
            text-align: left;
            align-items: flex-start;
        }
        .header-btn {
            width: 28px;
            height: 28px;
            border-radius: 14px;
            background: #f0ebe0;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            flex-shrink: 0;
            transition: all .15s;
        }
        .header-btn:active {
            transform: scale(0.9);
            background: #e0d5c0;
        }
        .night-mode .header-btn {
            background: #333550;
            border-color: #444;
            color: #ccc;
        }
        /* Chat area */
        #chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        #chat-scroll::-webkit-scrollbar {
            width: 3px;
        }
        #chat-scroll::-webkit-scrollbar-thumb {
            background: #c8b898;
            border-radius: 3px;
        }
        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            animation: fadeInUp .25s ease;
        }
        .msg-row.user {
            align-self: flex-end;
            align-items: flex-end;
        }
        .msg-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            cursor: pointer;
            transition: all .1s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .bubble.user-bub {
            background: var(--bubble-user);
            border-bottom-right-radius: 4px;
            color: #2a3a1a;
        }
        .bubble.other-bub {
            background: var(--bubble-other);
            border-bottom-left-radius: 4px;
            color: #3a2a1a;
        }
        .bubble.user-bub2 {
            background: var(--bubble-user2);
            border-bottom-right-radius: 4px;
        }
        .bubble.other-bub2 {
            background: var(--bubble-other2);
            border-bottom-left-radius: 4px;
        }
        .msg-meta {
            font-size: 10px;
            color: #999;
            margin-top: 2px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .msg-meta span {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity .15s;
        }
        .msg-meta span:hover {
            opacity: 1;
            text-decoration: underline;
        }
        .call-note {
            font-size: 11px;
            color: #888;
            align-self: center;
            background: #00000010;
            padding: 4px 12px;
            border-radius: 10px;
            margin: 4px 0;
        }
        .system-note {
            font-size: 10px;
            color: #aaa;
            align-self: center;
        }
        /* Footer */
        #footer-bar {
            height: var(--footer-h);
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            padding: 4px 6px;
            border-top: 1px solid #ddd8;
            gap: 4px;
            flex-shrink: 0;
            padding-bottom: var(--safe-bottom);
            z-index: 10;
        }
        #footer-bar button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f0ebe0;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
        }
        #footer-bar button:active {
            transform: scale(0.88);
        }
        #msg-input {
            flex: 1;
            min-height: 34px;
            max-height: 100px;
            border-radius: 18px;
            border: 1px solid #ddd;
            padding: 8px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: var(--font);
            background: #fffef9;
            overflow-y: auto;
            line-height: 1.4;
        }
        .night-mode #msg-input {
            background: #2a2a3a;
            color: #ccc;
            border-color: #444;
        }
        #send-btn {
            width: 38px;
            height: 38px;
            background: var(--accent);
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: var(--modal-z);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn .2s;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-panel {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 18px;
            max-width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 380px;
            color: var(--text);
            position: relative;
        }
        .modal-panel h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 17px;
            color: var(--accent);
            border-bottom: 1px solid #ddd6;
            padding-bottom: 8px;
        }
        .modal-panel input,
        .modal-panel textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            font-family: var(--font);
            background: #fffef9;
            resize: vertical;
            min-height: 40px;
        }
        .modal-panel textarea {
            min-height: 80px;
            max-height: 200px;
        }
        .modal-panel button {
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            margin: 4px;
            transition: all .15s;
            background: #e8dcc8;
            color: #3e2f1c;
        }
        .modal-panel button:active {
            transform: scale(0.93);
        }
        .modal-panel button.primary {
            background: var(--accent);
            color: #fff;
        }
        .modal-panel button.danger {
            background: #c0392b;
            color: #fff;
        }
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin: 8px 0;
        }
        .close-x {
            position: absolute;
            top: 8px;
            right: 14px;
            font-size: 22px;
            cursor: pointer;
            color: #999;
            z-index: 5;
        }
        .close-x:hover {
            color: #c0392b;
        }
        /* Popups */
        .popup-menu {
            position: absolute;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            z-index: var(--popup-z);
            padding: 8px;
            min-width: 140px;
            animation: fadeIn .15s;
        }
        .popup-menu button {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            border-radius: 8px;
            color: var(--text);
        }
        .popup-menu button:hover {
            background: #00000010;
        }
        .popup-menu button:active {
            background: #00000020;
        }
        /* Music mini */
        #music-mini {
            position: absolute;
            bottom: 70px;
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            z-index: 50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all .2s;
            display: none;
        }
        #music-mini.show {
            display: flex;
        }
        /* Color circles */
        .color-circle {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            margin: 4px;
            border: 2px solid transparent;
            transition: all .15s;
        }
        .color-circle:active {
            transform: scale(1.2);
            border-color: #333;
        }
        /* Chat list */
        .chat-list-item {
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #eee;
            transition: all .15s;
        }
        .chat-list-item:hover {
            background: #00000008;
        }
        .chat-list-item.active {
            background: #e8dcc8;
            font-weight: bold;
        }
    </style>
</head>
<body>

            <div class="header-center">
                <button class="header-btn" id="btn-settings" title="设置">⚙</button>

        </div>
        <!-- Chat scroll -->
        <div id="chat-scroll"></div>
        <!-- Footer -->
        <div id="footer-bar">
            <button id="btn-call" title="电话">📞</button>

            <button id="btn-emoticons" title="表情包">😊</button>
            <textarea id="msg-input" rows="1" placeholder="输入消息..."></textarea>
            <button id="btn-more" title="继续回复">⋯</button>
            <button id="send-btn" title="发送">▶</button>
        </div>
        <!-- Music mini -->
        <div id="music-mini" title="音乐播放中">🎵</div>
    </div>
    <!-- Hidden file inputs -->
    <input type="file" id="file-avatar-other" accept="image/*" style="display:none">
    <input type="file" id="file-avatar-self" accept="image/*" style="display:none">
    <input type="file" id="file-chat-bg" accept="image/*" style="display:none">
    <input type="file" id="file-emoticon" accept="image/*" style="display:none">
    <input type="file" id="file-music" accept="audio/*" style="display:none">

    <script>
        (function() {
            // ============ DATABASE LAYER (localStorage) ============
            const DB = {
                get(key, def = null) {
                    try { const v = localStorage.getItem('jz_' + key); return v ? JSON.parse(v) :
                            def; } catch (e) { return def; }
                },
                set(key, val) { try { localStorage.setItem('jz_' + key, JSON.stringify(val)); } catch (
                    e) {} },
                remove(key) { localStorage.removeItem('jz_' + key); }
            };

            // ============ TAROT ALGORITHM (78 cards, upright/reversed) ============
            const TarotDeck = (() => {
                const majorArcana = [
                    '愚者', '魔术师', '女祭司', '皇后', '皇帝', '教皇', '恋人', '战车', '力量', '隐者',
                    '命运之轮', '正义', '倒吊人', '死神', '节制', '恶魔', '高塔', '星星', '月亮', '太阳', '审判', '世界'
                ];
                const suits = ['权杖', '圣杯', '宝剑', '星币'];
                const ranks = ['王牌', '二', '三', '四', '五', '六', '七', '八', '九', '十', '侍从', '骑士', '王后', '国王'];
                const allCards = [];
                majorArcana.forEach(name => allCards.push({ name, type: 'major', number: majorArcana.indexOf(
                        name) }));
                suits.forEach(suit => {
                    ranks.forEach((rank, i) => {
                        allCards.push({ name: suit + rank, type: 'minor', suit, rank: i, number: 22 + allCards
                                .length - majorArcana.length });
                    });
                });
                const uprightMeanings = {
                    '愚者': '新的开始，冒险，天真，自由精神',
                    '魔术师': '创造力，技能，意志力，显化',
                    '女祭司': '直觉，潜意识，神秘，内在智慧',
                    '皇后': '丰饶，母性，自然，感官享受',
                    '皇帝': '权威，结构，稳定，领导力',
                    '教皇': '传统，信仰，教育，精神指引',
                    '恋人': '爱，和谐，关系，价值观选择',
                    '战车': '胜利，决心，控制，前进',
                    '力量': '勇气，耐心，内在力量，温柔',
                    '隐者': '内省，孤独，寻求真理，导师',
                    '命运之轮': '转折点，命运，循环，机遇',
                    '正义': '公正，真理，因果，法律',
                    '倒吊人': '牺牲，暂停，新视角，放手',
                    '死神': '结束，转变，重生，清理',
                    '节制': '平衡，适度，耐心，融合',
                    '恶魔': '束缚，物质主义，欲望，阴影',
                    '高塔': '突变，颠覆，启示，打破幻象',
                    '星星': '希望，灵感，宁静，治愈',
                    '月亮': '幻觉，恐惧，潜意识，迷茫',
                    '太阳': '快乐，成功，活力，清晰',
                    '审判': '觉醒，重生，召唤，评估',
                    '世界': '完成，整合，成就，旅行'
                };
                const reversedMeanings = {
                    '愚者': '鲁莽，风险，犹豫不决，逃避',
                    '魔术师': '操纵，技能不足，计划失败',
                    '女祭司': '忽视直觉，秘密被揭，表面化',
                    '皇后': '依赖，缺乏成长，情感枯竭',
                    '皇帝': '专制，僵化，失控，滥用权力',
                    '教皇': '反叛，非传统，盲目信仰',
                    '恋人': '分离，不和谐，错误选择',
                    '战车': '失控，失败，侵略性，缺乏方向',
                    '力量': '软弱，缺乏信心，粗暴',
                    '隐者': '孤独过度，逃避现实，偏执',
                    '命运之轮': '厄运，阻力，停滞',
                    '正义': '不公，逃避责任，偏见',
                    '倒吊人': '停滞不前，无谓牺牲，固执',
                    '死神': '抗拒改变，腐烂，停滞',
                    '节制': '失衡，过度，缺乏耐心',
                    '恶魔': '解脱，觉醒，摆脱束缚',
                    '高塔': '避免灾难，延迟改变，压抑',
                    '星星': '绝望，缺乏信心，灰心',
                    '月亮': '恐惧消散，真相浮现，平静',
                    '太阳': '暂时挫折，阴郁，缺乏活力',
                    '审判': '拒绝召唤，逃避评估，遗憾',
                    '世界': '未完成，缺乏闭环，延迟成功'
                };
                for (const suit of suits) {
                    const baseU = { '王牌': '新开始，潜力，礼物',
                        '二': '选择，平衡，合作',
                        '三': '成长，进展，初步成功',
                        '四': '稳定，休息，巩固',
                        '五': '冲突，竞争，挑战',
                        '六': '胜利，认可，进步',
                        '七': '坚持，防御，考验',
                        '八': '行动，速度，变化',
                        '九': '韧性，独立，守护',
                        '十': '完成，负担，终结',
                        '侍从': '消息，好奇，新学习',
                        '骑士': '行动，追求，冒险',
                        '王后': ' nurturing，务实，关怀',
                        '国王': '掌控，成就，权威' };
                    const baseR = { '王牌': '延迟，错失机会',
                        '二': '犹豫，失衡',
                        '三': '挫折，延迟',
                        '四': '不安，停滞',
                        '五': '妥协，和解',
                        '六': '延迟胜利，嫉妒',
                        '七': '放弃，崩溃',
                        '八': '仓促，错误',
                        '九': '孤立，偏执',
                        '十': '释放，解脱',
                        '侍从': '坏消息，懒惰',
                        '骑士': '鲁莽，延迟',
                        '王后': '依赖，忽视',
                        '国王': '滥用权力，失控' };
                    ranks.forEach(r => {
                        uprightMeanings[suit + r] = baseU[r] + ' (' + suit + ')';
                        reversedMeanings[suit + r] = baseR[r] + ' (' + suit + ')';
                    });
                }
                return {
                    allCards,
                    uprightMeanings,
                    reversedMeanings,
                    drawCard() {
                        const card = allCards[Math.floor(Math.random() * allCards.length)];
                        const isReversed = Math.random() < 0.5;
                        const meaning = isReversed ? (reversedMeanings[card.name] || '逆位解读') : (
                            uprightMeanings[card.name] || '正位解读');
                        return {
                            cardName: card.name,
                            isReversed,
                            position: isReversed ? '逆位' : '正位',
                            meaning,
                            type: card.type,
                            suit: card.suit || '大阿卡纳'
                        };
                    },
                    drawMultiple(count = 3) {
                        const results = [];
                        const pool = [...allCards];
                        for (let i = 0; i < Math.min(count, pool.length); i++) {
                            const idx = Math.floor(Math.random() * pool.length);
                            const card = pool.splice(idx, 1)[0];
                            const isReversed = Math.random() < 0.5;
                            results.push({
                                cardName: card.name,
                                isReversed,
                                position: isReversed ? '逆位' : '正位',
                                meaning: isReversed ? (reversedMeanings[card.name] || '逆位解读') : (
                                    uprightMeanings[card.name] || '正位解读'),
                                type: card.type,
                                suit: card.suit || '大阿卡纳'
                            });
                        }
                        return results;
                    }
                };
            })();

            // ============ XIAO LIU REN ALGORITHM ============
            const XiaoLiuRen = (() => {
                const palaces = ['大安', '留连', '速喜', '赤口', '小吉', '空亡'];
                const palaceMeanings = {
                    '大安': '大吉，事事昌盛，求谋顺利，平安稳定。宜：静守，等待时机。',
                    '留连': '中平，事难成就，纠缠不清，拖延反复。宜：耐心，勿急躁。',
                    '速喜': '大吉，喜事临门，快速有喜，求谋易成。宜：积极行动。',
                    '赤口': '凶，口舌是非，破败多端，纷争不和。宜：谨慎言行。',
                    '小吉': '大吉，诸事顺利，和合可成，贵人相助。宜：合作共赢。',
                    '空亡': '大凶，事不长久，谋事落空，劳而无功。宜：保守，勿妄动。'
                };
                const ziJieFa = {
                    '安': '大安',
                    '宁': '大安',
                    '静': '大安',
                    '留': '留连',
                    '连': '留连',
                    '缠': '留连',
                    '速': '速喜',
                    '喜': '速喜',
                    '快': '速喜',
                    '赤': '赤口',
                    '口': '赤口',
                    '争': '赤口',
                    '小': '小吉',
                    '吉': '小吉',
                    '利': '小吉',
                    '空': '空亡',
                    '亡': '空亡',
                    '虚': '空亡'
                };

                function calcByNumbers(a, b, c) {
                    let idx = (a - 1) % 6;
                    idx = (idx + b - 1) % 6;
                    idx = (idx + c - 1) % 6;
                    return palaces[idx];
                }

                function calcByHanzi(hanzi) {
                    if (!hanzi || hanzi.length === 0) return '大安';
                    const ch = hanzi[0];
                    if (ziJieFa[ch]) return ziJieFa[ch];
                    const code = ch.charCodeAt(0);
                    const idx = code % 6;
                    return palaces[idx];
                }
                return {
                    palaces,
                    palaceMeanings,
                    getResult(nums, hanzi) {
                        if (nums && nums.length >= 3 && nums.every(n => n >= 1 && n <= 12)) {
                            const palace = calcByNumbers(nums[0], nums[1], nums[2]);
                            return { method: '数字法', palace, meaning: palaceMeanings[palace], input: nums.join(
                                    ', ') };
                        }
                        if (hanzi && hanzi.trim().length > 0) {
                            const palace = calcByHanzi(hanzi.trim());
                            return { method: '字解法', palace, meaning: palaceMeanings[palace], input: hanzi.trim() };
                        }
                        const defPalace = palaces[Math.floor(Math.random() * 6)];
                        return { method: '随机', palace: defPalace, meaning: palaceMeanings[defPalace],
                        input: '无' };
                    }
                };
            })();

            // ============ AUDIO CONTEXT FOR SOUNDS ============
            let audioCtx = null;

            function getAudioCtx() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                return audioCtx;
            }

            function playBeep(freq, duration, type = 'sine') {
                if (!state.settings.soundEnabled) return;
                try {
                    const ctx = getAudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            }

            function playSound(type) {
                if (!state.settings.soundEnabled) return;
                switch (type) {
                    case 'dingding':
                        playBeep(800, 0.15);
                        setTimeout(() => playBeep(1000, 0.15), 150);
                        break;
                    case 'didi':
                        playBeep(600, 0.2);
                        break;
                    case 'wengweng':
                        playBeep(200, 0.4, 'triangle');
                        break;
                    default:
                        playBeep(800, 0.15);
                }
            }

            // ============ MUSIC PLAYER ============
            let musicAudio = null;

            function getMusicAudio() {
                if (!musicAudio) {
                    musicAudio = new Audio();
                    musicAudio.addEventListener('ended', onMusicEnded);
                    musicAudio.addEventListener('error', () => { state.musicIsPlaying = false;
                        updateMusicMini(); });
                }
                return musicAudio;
            }

            function onMusicEnded() {
                if (state.musicPlaylist.length === 0) { state.musicIsPlaying = false;
                    updateMusicMini(); return; }
                if (state.musicPlayMode === 'single') {
                    playCurrentMusic();
                } else if (state.musicPlayMode === 'sequential') {
                    state.musicCurrentIndex = (state.musicCurrentIndex + 1) % state.musicPlaylist.length;
                    playCurrentMusic();
                } else if (state.musicPlayMode === 'random') {
                    state.musicCurrentIndex = Math.floor(Math.random() * state.musicPlaylist.length);
                    playCurrentMusic();
                }
                saveState();
            }

            function playCurrentMusic() {
                if (state.musicPlaylist.length === 0 || state.musicCurrentIndex < 0 || state.musicCurrentIndex >= state
                    .musicPlaylist.length) return;
                const track = state.musicPlaylist[state.musicCurrentIndex];
                const audio = getMusicAudio();
                audio.src = track.dataUrl || track.url || '';
                audio.play().then(() => {
                    state.musicIsPlaying = true;
                    updateMusicMini();
                }).catch(() => {
                    state.musicIsPlaying = false;
                    updateMusicMini();
                });
            }

            function updateMusicMini() {
                if (state.musicIsPlaying && state.musicPlaylist.length > 0) {
                    musicMini.classList.add('show');
                } else {
                    musicMini.classList.remove('show');
                }
            }

            function toggleMusicPlayPause() {
                const audio = getMusicAudio();
                if (state.musicIsPlaying) {
                    audio.pause();
                    state.musicIsPlaying = false;
                } else {
                    if (state.musicPlaylist.length > 0) {
                        if (state.musicCurrentIndex < 0) state.musicCurrentIndex = 0;
                        playCurrentMusic();
                    }
                }
                updateMusicMini();
                saveState();
            }
            musicMini.addEventListener('click', () => {
                toggleMusicPlayPause();
                showMusicPanel();
            });

            // ============ RENDER CHAT ============
            function renderChat() {
                const chat = getCurrentChat();
                if (!chat) return;
                chatScroll.innerHTML = '';
                const allMessages = chat.messages || [];
                allMessages.forEach((msg, idx) => {
                    appendMsgToDOM(msg, idx, chat);
                });
                // Call history
                (chat.callHistory || []).forEach(ch => {
                    const div = document.createElement('div');
                    div.className = 'call-note';
                    div.textContent = ch;
                    chatScroll.appendChild(div);
                });
                chatScroll.scrollTop = chatScroll.scrollHeight;
                updateHeaderDisplay(chat);
                applyChatTheme(chat);
            }

            function appendMsgToDOM(msg, idx, chat) {
                const row = document.createElement('div');
                row.className = 'msg-row ' + (msg.sender === 'user' ? 'user' : 'other');
                row.dataset.msgIdx = idx;
                const bubble = document.createElement('div');
                const bs = chat.bubbleStyle || 0;
                if (msg.sender === 'user') {
                    bubble.className = 'bubble user-bub' + (bs === 2 ? '2' : '');
                } else {
                    bubble.className = 'bubble other-bub' + (bs === 2 ? '2' : '');
                }
                bubble.textContent = msg.text;
                bubble.title = '长按/点击查看选项';
                bubble.addEventListener('contextmenu', (e) => { e.preventDefault();
                    showMsgMenu(e, idx, msg); });
                bubble.addEventListener('click', (e) => { if (e.detail === 2 || e.shiftKey) showMsgMenu(e, idx, msg); });
                row.appendChild(bubble);
                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                const timeSpan = document.createElement('span');
                timeSpan.textContent = new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const refSpan = document.createElement('span');
                refSpan.textContent = '引用';
                refSpan.addEventListener('click', (e) => { e.stopPropagation();
                    quoteMsg(msg); });
                const favSpan = document.createElement('span');
                favSpan.textContent = msg.favorited ? '★已收藏' : '收藏';
                favSpan.addEventListener('click', (e) => { e.stopPropagation();
                    toggleFavMsg(idx, chat, favSpan); });
                const delSpan = document.createElement('span');
                delSpan.textContent = '删除';
                delSpan.addEventListener('click', (e) => { e.stopPropagation();
                    deleteMsg(idx, chat); });
                meta.appendChild(timeSpan);
                meta.appendChild(refSpan);
                meta.appendChild(favSpan);
                meta.appendChild(delSpan);
                row.appendChild(meta);
                chatScroll.appendChild(row);
            }

            function showMsgMenu(e, idx, msg) {
                removePopup();
                const popup = document.createElement('div');
                popup.className = 'popup-menu';
                popup.style.position = 'fixed';
                popup.style.left = Math.min(e.clientX, window.innerWidth - 160) + 'px';
                popup.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
                const chat = getCurrentChat();
                const btns = [
                    { text: '引用', action: () => quoteMsg(msg) },
                    { text: msg.favorited ? '取消收藏' : '收藏', action: () => { toggleFavMsg(idx, chat);
                            removePopup(); } },
                    { text: '删除', action: () => { deleteMsg(idx, chat);
                            removePopup(); } },
                    { text: '关闭', action: removePopup },
                ];
                btns.forEach(b => {
                    const btn = document.createElement('button');
                    btn.textContent = b.text;
                    btn.addEventListener('click', b.action);
                    popup.appendChild(btn);
                });
                document.body.appendChild(popup);
                popup._popup = true;
                setTimeout(() => document.addEventListener('click', removePopupOnClick, { once: true }), 50);
            }

                document.querySelectorAll('.popup-menu').forEach(p => p.remove());

            // ============ SEND MESSAGE ============
            function sendMessage(text) {
                if (!text.trim()) return;
                const chat = getCurrentChat();
                if (!chat) return;
                const msg = {
                    text: text.trim(),
                    sender: 'user',
                    time: Date.now(),
                    favorited: false,
                };

                saveState();
                renderChat();
                playSound(state.settings.soundType);

            function scheduleReply(chat) {
                const speed = state.settings.replySpeed || 3;
                const delay = speed * 1000;
                setTimeout(() => {
                    generateTarotReply(chat);
                    if (state.settings.continuousReply) {
                        const extra = Math.floor(Math.random() * (state.settings.maxContinuous || 3));
                        for (let i = 0; i < extra; i++) {
                            setTimeout(() => generateTarotReply(chat), (i + 1) * (speed * 1000 + Math.random() *
                                3000));
                        }
                    }
                }, delay);
            }

            function generateTarotReply(chat) {
                if (state.customReplies.length === 0) {
                    const draw = TarotDeck.drawCard();
                    const replyText = '【塔罗占卜】' + draw.cardName + '（' + draw.position + '）：' + draw.meaning;
                    addSystemReply(chat, replyText);
                    return;
                }
                const useEmoticon = state.settings.useEmoticons && state.emoticons.length > 0 && Math.random() < 0.3;
                if (useEmoticon) {
                    const emo = state.emoticons[Math.floor(Math.random() * state.emoticons.length)];
                    const replyText = state.customReplies[Math.floor(Math.random() * state.customReplies.length)];
                    addSystemReply(chat, replyText, emo);
                } else {
                    const count = 1 + Math.floor(Math.random() * Math.min(3, state.customReplies.length));
                    const pool = [...state.customReplies];
                    const selected = [];
                    for (let i = 0; i < count; i++) {
                        if (pool.length === 0) break;
                        const idx = Math.floor(Math.random() * pool.length);
                        selected.push(pool.splice(idx, 1)[0]);
                    }
                    addSystemReply(chat, selected.join('\n'));
                }
            }

            function showEditModal(title, initialVal, callback, isTextarea = false) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const panel = document.createElement('div');
                panel.className = 'modal-panel';
                panel.innerHTML = '<span class="close-x">×</span><h3>' + title + '</h3>';
                const input = document.createElement(isTextarea ? 'textarea' : 'input');
                input.value = initialVal;
                input.rows = isTextarea ? 6 : 1;

                const btnRow = document.createElement('div');
                btnRow.className = 'btn-row';
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'primary';
                confirmBtn.textContent = '确认';
                const cancelBtn = document.createElement('button');
                cancelBtn.textContent = '取消';
                btnRow.appendChild(confirmBtn);
                btnRow.appendChild(cancelBtn);
                panel.appendChild(btnRow);
                overlay.appendChild(panel);
                document.body.appendChild(overlay);

                        '</button> <select id="sound-type-select">' + ['dingding', 'didi', 'wengweng'].map(s =>
                            '<option value="' + s + '"' + (state.settings.soundType === s ? ' selected' : '') + '>' +
                            ({ 'dingding': '钉钉', 'didi': '滴滴', 'wengweng': '嗡嗡' }[s]) + '</option>').join('') +

                    content.querySelector('#speed-select').addEventListener('change', function() {

                    content.querySelector('#toggle-sound-btn').addEventListener('click', function() {

                    content.querySelector('#advanced-settings-btn').addEventListener('click', function() {

                    content.querySelector('#import-chat-btn').addEventListener('click', () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = '.json';
                        input.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                try {
                                    const data = JSON.parse(ev.target.result);
                                    if (data.messages && Array.isArray(data.messages)) {
                                        const chat = getCurrentChat();
                                        if (chat) { chat.messages = chat.messages.concat(data
                                                .messages);
                                            saveState();
                                            renderChat();
                                            alert('导入成功！'); }
                                    }
                                } catch (err) { alert('导入失败，格式错误。'); }
                            };
                            reader.readAsText(file);
                        });
                        input.click();
                    });
                    content.querySelector('#export-chat-btn').addEventListener('click', () => {
                        const chat = getCurrentChat();
                        if (!chat) return;
                        const blob = new Blob([JSON.stringify({ messages: chat.messages }, null, 2)], {

                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');

                        a.download = 'chat_export_' + Date.now() + '.json';

                    content.querySelector('#view-del-chat-mem-btn').addEventListener('click', () => {

                        if (confirm('当前聊天记录内存约' + kb + 'KB，共' + chat.messages.length +

                            renderChat();
                            alert('已删除。');

                    content.querySelector('#toggle-pwd-btn').addEventListener('click', function() {

                    content.querySelector('#set-pwd-btn').addEventListener('click', () => {
                        showEditModal('设置密码（留空则取消密码）', state.settings.password || '', (val) => {
                            state.settings.password = val.trim();
                            state.settings.passwordEnabled = val.trim().length > 0;
                            saveState();
                            alert(val.trim() ? '密码已设置。' : '密码已取消。');
                        });
                    });
                }
            }

                    '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #eee;">' +

            // File inputs for chat bg
            fileChatBg.addEventListener('change', function(e) {

            // ============ NEW CHAT / CHAT MANAGEMENT ============

                listDiv.style.overflowY = 'auto';
                state.chats.forEach(chat => {
                    const item = document.createElement('div');

                    item.addEventListener('click', (e) => {

                                chat.name = val;

                                overlay.remove();

                            return;

                        if (e.target.classList.contains('del-chat-btn')) {
                            if (confirm('确定删除此聊天？')) {
                                state.chats = state.chats.filter(c => c.id !== chat.id);
                                if (state.currentChatId === chat.id) state.currentChatId = state
                                    .chats[0]?.id || null;

                                saveState();
                                renderChat();

            // ============ CALENDAR ============
            btnCalendar.addEventListener('click', showCalendarPanel);

            function showCalendarPanel() {
                removePopup();
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const panel = document.createElement('div');
                panel.className = 'modal-panel';
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const monthKey = year + '-' + (month + 1);
                const marks = state.calendarMarks[monthKey] || [];
                panel.innerHTML = '<span class="close-x">×</span><h3>📅 ' + year + '年' + (month + 1) + '月</h3>';
                const grid = document.createElement('div');
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(7,1fr)';
                grid.style.gap = '4px';
                grid.style.textAlign = 'center';
                ['日', '一', '二', '三', '四', '五', '六'].forEach(d => {
                    const h = document.createElement('div');
                    h.textContent = d;
                    h.style.fontWeight = 'bold';
                    h.style.fontSize = '11px';
                    grid.appendChild(h);
                });
                const firstDay = new Date(year, month, 1).getDay();
                for (let i = 0; i < firstDay; i++) { const emp = document.createElement('div');
                    grid.appendChild(emp); }
                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.createElement('div');
                    cell.textContent = d;
                    cell.style.padding = '6px';
                    cell.style.borderRadius = '8px';
                    cell.style.cursor = 'pointer';
                    cell.style.fontSize = '13px';
                    if (marks.includes(d)) cell.style.background = '#ffb6c1';
                    if (d === now.getDate()) cell.style.border = '2px solid #8b5e3c';
                    const cutoff = state.calendarCutoff || 31;
                    if (d > cutoff && marks.includes(d)) cell.style.opacity = '0.5';
                    cell.addEventListener('click', () => {
                        if (marks.includes(d)) {
                            state.calendarMarks[monthKey] = marks.filter(m => m !== d);
                        } else {
                            if (!state.calendarMarks[monthKey]) state.calendarMarks[monthKey] = [];
                            state.calendarMarks[monthKey].push(d);
                            const cycle = state.calendarCycle || 7;
                            for (let i = 1; i < cycle; i++) {
                                const nd = d + i;
                                if (nd <= daysInMonth && nd <= (state.calendarCutoff || 31) && !state
                                    .calendarMarks[monthKey].includes(nd)) {
                                    state.calendarMarks[monthKey].push(nd);
                                }
                            }
                        }
                        saveState();
                        overlay.remove();
                        showCalendarPanel();
                    });
                    grid.appendChild(cell);
                }
                panel.appendChild(grid);
                const btnRow = document.createElement('div');
                btnRow.className = 'btn-row';
                const addCycleBtn = document.createElement('button');
                addCycleBtn.textContent = '周期：' + (state.calendarCycle || 7) + '天';
                addCycleBtn.addEventListener('click', () => {
                    showEditModal('月经周期（1-15天）', String(state.calendarCycle || 7), (val) => {
                        const n = parseInt(val);
                        if (n >= 1 && n <= 15) { state.calendarCycle = n;
                            saveState();
                            overlay.remove();
                            showCalendarPanel(); }
                    });
                });
                const delMonthBtn = document.createElement('button');
                delMonthBtn.className = 'danger';
                delMonthBtn.textContent = '删除此月标记';
                delMonthBtn.addEventListener('click', () => {
                    if (confirm('删除' + monthKey + '所有标记？')) {
                        delete state.calendarMarks[monthKey];
                        saveState();
                        overlay.remove();
                        showCalendarPanel();
                    }
                });
                const cutoffBtn = document.createElement('button');
                cutoffBtn.textContent = '截止：' + (state.calendarCutoff || 31) + '日';
                cutoffBtn.addEventListener('click', () => {
                    showEditModal('截止日期（1-31）', String(state.calendarCutoff || 31), (val) => {
                        const n = parseInt(val);
                        if (n >= 1 && n <= 31) { state.calendarCutoff = n;
                            saveState();
                            overlay.remove();
                            showCalendarPanel(); }
                    });
                });
                btnRow.appendChild(addCycleBtn);
                btnRow.appendChild(delMonthBtn);
                btnRow.appendChild(cutoffBtn);
                panel.appendChild(btnRow);
                overlay.appendChild(panel);
                document.body.appendChild(overlay);
                panel.querySelector('.close-x').addEventListener('click', () => overlay.remove());
                overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            }

            function showLetterDetail(letter, idx, parentOverlay) {
                parentOverlay.remove();
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const panel = document.createElement('div');
                panel.className = 'modal-panel';

                overlay.appendChild(panel);

                overlay.addEventListener('click', (e) => { if (e.target === overlay) { overlay.remove();
                        showLettersPanel(); } });
                panel.querySelector('#delete-letter-btn').addEventListener('click', () => {
                    state.letters.inbox.splice(idx, 1);

                    overlay.remove();
                    showLettersPanel();
                });
                panel.querySelector('#reply-letter-btn').addEventListener('click', () => {
                    overlay.remove();

                        if (val.trim()) {
                            const reply = { text: val.trim(), time: Date.now(), type: 'sent',
                                preview: val.trim().substring(0, 30) + '...' };
                            state.letters.sent.push(reply);
                            state.letters.inbox[idx].replied = true;
                            scheduleLetterReply(reply);

                        }
                    }, true);
                    setTimeout(showLettersPanel, 300);
                });
            }

            function scheduleLetterReply(letter) {
                const maxWait = state.settings.letterMaxWait || 7;
                const delay = (1 + Math.random() * maxWait) * 3600000;
                const actualDelay = Math.min(delay, maxWait * 3600000);
                setTimeout(() => {
                    const replyLines = [];
                    const pool = state.customReplies.length > 0 ? state.customReplies : ['已收到你的来信，愿一切安好。'];
                    const count = 1 + Math.floor(Math.random() * Math.min(25, pool.length));
                    const used = new Set();
                    for (let i = 0; i < count; i++) {
                        const idx = Math.floor(Math.random() * pool.length);
                        if (!used.has(idx)) { replyLines.push(pool[idx]);
                            used.add(idx); }
                        if (used.size >= pool.length) break;
                    }
                    const replyText = replyLines.join('\n') || '感谢来信。';
                    state.letters.inbox.push({ text: replyText, time: Date.now(), preview: replyText.substring(0, 30) +
                            '...', replied: false });
                    saveState();
                }, actualDelay);
            }

                    if (pw !== state.settings.password) {
                        document.body.innerHTML =
                            '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:20px;color:#fff;background:#1a1a2e;">密码错误，访问被拒绝。<br><button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;border-radius:20px;background:#8b5e3c;color:#fff;border:none;cursor:pointer;">重试</button></div>';
                        return false;
                    }
                }
                return true;
            }

            // ============ INIT ============
            function init() {
                if (!checkPassword()) return;
                renderChat();
                updateMusicMini();
                // Restore music playback if was playing
                if (state.musicIsPlaying && state.musicPlaylist.length > 0 && state.musicCurrentIndex >= 0) {
                    const audio = getMusicAudio();
                    const track = state.musicPlaylist[state.musicCurrentIndex];
                    if (track && (track.dataUrl || track.url)) {
                        audio.src = track.dataUrl || track.url;
                        audio.play().catch(() => { state.musicIsPlaying = false;
                            updateMusicMini(); });
                    }
                }
                // Apply theme
                const chat = getCurrentChat();
                if (chat) applyChatTheme(chat);
            }

            // Handle keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay').forEach(o => o.remove());
                    removePopup();
                }
            });

            // Handle viewport for mobile keyboard
            window.addEventListener('resize', () => {
                if (window.innerHeight < 500) {
                    document.getElementById('footer-bar')?.style.setProperty('position', 'relative');
                } else {
                    document.getElementById('footer-bar')?.style.setProperty('position', '');
                }
            });

            // Save state periodically
            setInterval(saveState, 5000);

            // Init
            init();

            console.log('🔮 简传记已就绪 | 塔罗牌78张正逆位 | 小六壬+字解法 | 微信风格聊天界面');
            console.log('📊 聊天数：' + state.chats.length + ' | 字卡数：' + state.customReplies.length + ' | 表情包数：' + state
                .emoticons.length);
            console.log('🎵 音乐曲目数：' + state.musicPlaylist.length + ' | 信件数：' + state.letters.inbox.length);
        })();
    </script>
</body>
