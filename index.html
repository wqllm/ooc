<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>简传记</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --topbar-bg: #e8dcc8;
      --bottombar-bg: #e8dcc8;
      --chat-bg: #f5f0e8;
      --bubble-other: #ffffff;
      --bubble-self: #c8e6c9;
      --text: #333;
      --text-light: #666;
      --border: #d5c8a8;
      --accent: #8b7355;
      --modal-bg: #fff;
      --input-bg: #fff;
      --radius: 4px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    .night-mode {
      --bg: #1a1a2e;
      --topbar-bg: #252538;
      --bottombar-bg: #252538;
      --chat-bg: #1a1a2e;
      --bubble-other: #2a2a40;
      --bubble-self: #1e3a2f;
      --text: #ddd;
      --text-light: #aaa;
      --border: #3a3a50;
      --accent: #b8a080;
      --modal-bg: #252538;
      --input-bg: #2a2a40;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    #app {
      display: flex; flex-direction: column; height: 100%; width: 100%;
      position: relative; overflow: hidden;
    }
    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      height: 50px; padding: 0 6px;
      background: var(--topbar-bg); border-bottom: 1px solid var(--border);
      z-index: 100; flex-shrink: 0;
    }
    .top-left, .top-right {
      display: flex; align-items: center; gap: 4px;
      min-width: 0; flex-shrink: 0;
    }
    .top-left { max-width: 28%; }
    .top-right { max-width: 28%; flex-direction: row-reverse; text-align: right; }
    .top-center {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex: 1; font-size: 11px; flex-wrap: nowrap;
    }
    .top-center span {
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
      background: var(--input-bg); border: 1px solid var(--border);
      white-space: nowrap; font-size: 11px;
    }
    .avatar-sm {
      width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
      cursor: pointer; border: 2px solid var(--border); background: #ddd;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .nick-status { display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
    .nick { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    .status { font-size: 10px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    #chat-area {
      flex: 1; overflow-y: auto; padding: 10px 12px;
      background: var(--chat-bg); position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .msg-row {
      display: flex; margin: 6px 0; align-items: flex-start; gap: 6px;
      position: relative;
    }
    .msg-row.self { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 72%; padding: 9px 13px; border-radius: 14px;
      word-break: break-word; white-space: pre-wrap; font-size: 14px;
      position: relative; cursor: pointer;
      background: var(--bubble-other); border-bottom-left-radius: 4px;
    }
    .msg-row.self .msg-bubble {
      background: var(--bubble-self); border-bottom-right-radius: 4px;
    }
    .call-note { font-size: 10px; color: var(--text-light); text-align: center; width: 100%; padding: 3px 0; }
    .sticker-img { width: 70px; height: 80px; object-fit: contain; border-radius: 6px; cursor: pointer; }
    #bottombar {
      display: flex; align-items: center; gap: 4px; padding: 6px 8px;
      background: var(--bottombar-bg); border-top: 1px solid var(--border);
      z-index: 100; flex-shrink: 0; padding-bottom: calc(6px + var(--safe-bottom));
    }
    #bottombar button {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--input-bg); cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    #msg-input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--input-bg); font-size: 14px; resize: none; outline: none; color: var(--text);
      max-height: 100px; font-family: inherit;
    }
    #send-btn {
      padding: 8px 16px; border-radius: 20px; background: var(--accent);
      color: #fff; border: none; cursor: pointer; font-weight: 600;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .modal-box {
      background: var(--modal-bg); border-radius: 6px;
      width: 92%; max-width: 420px; max-height: 80vh; overflow-y: auto;
      padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      position: relative; border: 1px solid var(--border);
    }
    .modal-box h3 { text-align: center; margin-bottom: 12px; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .close-btn {
      position: absolute; top: 8px; right: 12px; cursor: pointer;
      font-size: 22px; color: var(--text-light); z-index: 5;
    }
    .modal-box input[type="text"], .modal-box textarea {
      width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--border);
      font-size: 14px; background: var(--input-bg); color: var(--text); font-family: inherit;
    }
    .modal-box button {
      padding: 8px 14px; border-radius: 4px; border: 1px solid var(--border);
      cursor: pointer; background: var(--input-bg); color: var(--text); margin: 4px;
    }
    .modal-box button.primary { background: var(--accent); color: #fff; border: none; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 6px 0; }
    #music-mini, #call-mini {
      position: fixed; width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #fff; display: none; align-items: center;
      justify-content: center; cursor: pointer; z-index: 180;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 18px;
    }
    #music-mini { bottom: 80px; right: 10px; }
    #call-mini { top: 60px; right: 10px; }
    .password-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 999;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    .password-screen input { padding: 12px; border-radius: 4px; border: 1px solid var(--border); font-size: 16px; text-align: center; background: var(--input-bg); color: var(--text); }
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="top-left">
      <div class="avatar-sm" id="other-avatar">👤</div>
      <div class="nick-status">
        <span class="nick" id="other-nick">对方</span>
        <span class="status" id="other-status">在线</span>
      </div>
    </div>
    <div class="top-center">
      <span id="btn-settings">设置</span>
      <span id="btn-newchat">新建聊天</span>
      <span id="btn-calendar">日历</span>
      <span id="btn-music">音乐</span>
      <span id="btn-xiaoliu">小六起卦</span>
      <span id="btn-favorites">⭐收藏</span>
    </div>
    <div class="top-right">
      <div class="avatar-sm" id="self-avatar">🧑</div>
      <div class="nick-status" style="align-items:flex-end;">
        <span class="nick" id="self-nick">我</span>
        <span class="status" id="self-status">在线</span>
      </div>
    </div>
  </div>
  <div id="chat-area"></div>
  <div id="bottombar">
    <button id="btn-call">📞</button>
    <button id="btn-letters">✉</button>
    <button id="btn-stickers">😊</button>
    <textarea id="msg-input" rows="1" placeholder="输入消息..."></textarea>
    <button id="btn-dots">⋯</button>
    <button id="send-btn">发送</button>
  </div>
</div>
<div id="music-mini">🎵</div>
<div id="call-mini">📞</div>
<div id="password-screen" class="password-screen">
  <h3>🔒 简传记</h3>
  <input type="password" id="pwd-input" placeholder="请输入密码">
  <button id="pwd-submit">进入</button>
  <span style="font-size:11px;">默认密码：123456</span>
</div>
<div id="modal-container"></div>
<script>
(function() {
  // ========== IndexedDB ==========
  const DB_NAME = 'JianZhuanJi';
  let db;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 2);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('store')) d.createObjectStore('store', { keyPath: 'id' });
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = reject;
    });
  }
  function dbGet(key) {
    return new Promise((resolve) => {
      if (!db) { resolve(null); return; }
      const tx = db.transaction('store', 'readonly');
      const store = tx.objectStore('store');
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror = () => resolve(null);
    });
  }
  function dbSet(key, data) {
    return new Promise((resolve) => {
      if (!db) { resolve(); return; }
      const tx = db.transaction('store', 'readwrite');
      const store = tx.objectStore('store');
      store.put({ id: key, data: data });
      tx.oncomplete = resolve;
      tx.onerror = () => resolve();
    });
  }

  // ========== 全局状态 ==========
  const DEFAULT_PASSWORD = '123456';
  let APP_DATA = {
    password: DEFAULT_PASSWORD,
    passwordEnabled: true,
    chatInterfaces: [],
    currentChatId: null,
    messages: {},
    wordCards: ['你好呀','今天过得怎么样？','一切都会好起来的','相信自己','命运之轮在转动'],
    settings: {
      replySpeed: 3,
      continuousReply: false,
      maxContinuous: 5,
      stickerReply: false,
      soundType: 'dingding',
      soundEnabled: true
    },
    letters: [],
    drafts: [],
    stickers: [],
    musicList: [],
    musicPlayMode: 'sequential',
    musicCurrentIndex: -1,
    musicIsPlaying: false,
    calendarMarks: {},
    xiaoliuHistory: [],
    favorites: {},
    callActive: false,
    callChatId: null,
    callStartTime: null,
    callTimer: null
  };

  function saveAll() { return dbSet('appData', APP_DATA); }
  function loadAll() {
    return dbGet('appData').then(data => {
      if (data) {
        APP_DATA = { ...APP_DATA, ...data };
        if (!APP_DATA.messages) APP_DATA.messages = {};
        if (!APP_DATA.favorites) APP_DATA.favorites = {};
        if (!APP_DATA.chatInterfaces || APP_DATA.chatInterfaces.length===0) {
          APP_DATA.chatInterfaces = [createDefaultChat()];
          APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
        }
        if (!APP_DATA.currentChatId && APP_DATA.chatInterfaces.length>0) {
          APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
        }
      } else {
        APP_DATA.chatInterfaces = [createDefaultChat()];
        APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
      }
    });
  }

  function createDefaultChat() {
    return {
      id: 'c'+Date.now(),
      name: '聊天1',
      otherAvatar: '',
      otherNick: '对方',
      otherStatus: '在线',
      selfAvatar: '',
      selfNick: '我',
      selfStatus: '在线',
      bgImage: '',
      bubbleStyle: 'white-green',
      themeColor: 'default',
      nightMode: false
    };
  }

  function getCurrentChat() {
    return APP_DATA.chatInterfaces.find(c=>c.id===APP_DATA.currentChatId) || APP_DATA.chatInterfaces[0];
  }
  function getMsgs(chatId) {
    if (!APP_DATA.messages[chatId]) APP_DATA.messages[chatId] = [];
    return APP_DATA.messages[chatId];
  }

  // ========== 塔罗牌 ==========
  const TAROT_DECK = [
    {id:0,name:'愚者',upright:'新的开始、冒险',reversed:'鲁莽、风险'},
    {id:1,name:'魔术师',upright:'创造力、技能',reversed:'能力不足'},
    {id:2,name:'女祭司',upright:'直觉、潜意识',reversed:'忽视直觉'},
    {id:3,name:'皇后',upright:'丰饶、母性',reversed:'依赖、贫瘠'},
    {id:4,name:'皇帝',upright:'权威、结构',reversed:'暴政、 rigid'},
    {id:5,name:'教皇',upright:'传统、信仰',reversed:'挑战传统'},
    {id:6,name:'恋人',upright:'爱情、和谐',reversed:'分离、冲突'},
    {id:7,name:'战车',upright:'胜利、决心',reversed:'失控、失败'},
    {id:8,name:'力量',upright:'勇气、耐心',reversed:'软弱、自我怀疑'},
    {id:9,name:'隐士',upright:'内省、智慧',reversed:'孤独、逃避'},
    {id:10,name:'命运之轮',upright:'转变、机遇',reversed:'厄运、抵抗'},
    {id:11,name:'正义',upright:'公正、真相',reversed:'不公、逃避责任'},
    {id:12,name:'倒吊人',upright:'牺牲、换个角度',reversed:'停滞、无谓牺牲'},
    {id:13,name:'死神',upright:'结束、转变',reversed:'抗拒改变'},
    {id:14,name:'节制',upright:'平衡、调和',reversed:'失衡、过度'},
    {id:15,name:'恶魔',upright:'束缚、欲望',reversed:'解脱、觉醒'},
    {id:16,name:'高塔',upright:'突变、启示',reversed:'避免灾难'},
    {id:17,name:'星星',upright:'希望、灵感',reversed:'绝望、失去信心'},
    {id:18,name:'月亮',upright:'幻觉、恐惧',reversed:'恐惧消散'},
    {id:19,name:'太阳',upright:'快乐、成功',reversed:'暂时挫折'},
    {id:20,name:'审判',upright:'觉醒、重生',reversed:'逃避召唤'},
    {id:21,name:'世界',upright:'完成、整合',reversed:'未完成、延迟'},
    ...['权杖','圣杯','宝剑','星币'].flatMap(s=>[
      {name:s+'Ace',upright:s+'之始',reversed:'开端不利'},
      {name:s+'2',upright:s+'之二',reversed:'犹豫不决'},
      {name:s+'3',upright:s+'之三',reversed:'成长受阻'},
      {name:s+'4',upright:s+'之四',reversed:'不安定'},
      {name:s+'5',upright:s+'之五',reversed:'妥协'},
      {name:s+'6',upright:s+'之六',reversed:'失败'},
      {name:s+'7',upright:s+'之七',reversed:'放弃'},
      {name:s+'8',upright:s+'之八',reversed:'延迟'},
      {name:s+'9',upright:s+'之九',reversed:'疲惫'},
      {name:s+'10',upright:s+'之十',reversed:'释放负担'},
      {name:s+'侍从',upright:s+'消息',reversed:'坏消息'},
      {name:s+'骑士',upright:s+'行动',reversed:'鲁莽'},
      {name:s+'皇后',upright:s+' nurturing',reversed:'过度保护'},
      {name:s+'国王',upright:s+'掌控',reversed:'失控'}
    ])
  ];
  function tarotReply() {
    const cards = APP_DATA.wordCards;
    if (cards.length===0) return '暂无字卡';
    const count = Math.min(Math.floor(Math.random()*3)+1, cards.length);
    const pool = [...cards];
    const selected = [];
    for(let i=0;i<count;i++) {
      const ri = Math.floor(Math.random()*pool.length);
      selected.push(pool.splice(ri,1)[0]);
    }
    return selected.join(' ');
  }

  // ========== 小六壬 ==========
  const XIAOLIU = ['大安','留连','速喜','赤口','小吉','空亡'];
  const XIAOLIU_MEAN = {
    '大安':'大吉，事事昌盛',
    '留连':'中平，纠缠不清',
    '速喜':'大吉，快速达成',
    '赤口':'凶，口舌是非',
    '小吉':'吉，小有收获',
    '空亡':'大凶，谋事落空'
  };
  function xiaoLiuRen(a,b,c) {
    const n1 = ((a-1)%6+6)%6;
    const n2 = ((n1+b-1)%6+6)%6;
    const n3 = ((n2+c-1)%6+6)%6;
    return {name:XIAOLIU[n3],meaning:XIAOLIU_MEAN[XIAOLIU[n3]]};
  }
  function ziJieFa(char) {
    if(!char) return {analysis:'请输入汉字'};
    const code = char.charCodeAt(0);
    const strokes = (code%30)+1;
    const wuxing = ['金','木','水','火','土'][strokes%5];
    return {analysis:`${char}：五行${wuxing}，约${strokes}画。`};
  }

  // ========== 音频 ==========
  function playSound(type) {
    if(!APP_DATA.settings.soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.value = 0.1;
      if(type==='dingding') { osc.frequency.value=800; osc.type='sine'; }
      else if(type==='didi') { osc.frequency.value=600; osc.type='square'; }
      else { osc.frequency.value=200; osc.type='sawtooth'; }
      osc.start(); osc.stop(ctx.currentTime+0.25);
    } catch(e){}
  }

  // ========== UI 渲染 ==========
  const $chat = document.getElementById('chat-area');
  const $input = document.getElementById('msg-input');
  const $modal = document.getElementById('modal-container');
  const $musicMini = document.getElementById('music-mini');
  const $callMini = document.getElementById('call-mini');

  function renderTopbar() {
    const chat = getCurrentChat();
    document.getElementById('other-nick').textContent = chat.otherNick||'对方';
    document.getElementById('other-status').textContent = chat.otherStatus||'在线';
    document.getElementById('self-nick').textContent = chat.selfNick||'我';
    document.getElementById('self-status').textContent = chat.selfStatus||'在线';
    const oa = document.getElementById('other-avatar');
    oa.innerHTML = chat.otherAvatar ? `<img src="${chat.otherAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤';
    const sa = document.getElementById('self-avatar');
    sa.innerHTML = chat.selfAvatar ? `<img src="${chat.selfAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '🧑';
    if(chat.nightMode) document.body.classList.add('night-mode');
    else document.body.classList.remove('night-mode');
    const bubbleMap = {
      'white-green': ['#fff','#c8e6c9'],
      'white-white': ['#fff','#fff'],
      'orange-orange': ['#ffe0b2','#ffe0b2']
    };
    const [bo,bs] = bubbleMap[chat.bubbleStyle] || ['#fff','#c8e6c9'];
    document.documentElement.style.setProperty('--bubble-other',bo);
    document.documentElement.style.setProperty('--bubble-self',bs);
    const themeMap = { 'lightpink':'#fce4ec','lightwhite':'#fafafa','lightgreen':'#e8f5e9','deepblue':'#1a237e','lightblue':'#e3f2fd','default':'#f5f0e8' };
    if(!chat.nightMode) document.documentElement.style.setProperty('--chat-bg', themeMap[chat.themeColor]||'#f5f0e8');
  }

  function renderChat() {
    const chat = getCurrentChat();
    const msgs = getMsgs(chat.id);
    $chat.innerHTML = '';
    if(chat.bgImage) $chat.style.backgroundImage = `url(${chat.bgImage})`;
    else $chat.style.backgroundImage = '';
    msgs.forEach(msg=>{
      const row = document.createElement('div');
      row.className = 'msg-row '+(msg.from==='self'?'self':'other');
      if(msg.type==='call'){
        row.innerHTML = `<div class="call-note">📞 ${msg.callResult||'通话'} ${msg.callDuration||''}</div>`;
      } else if(msg.type==='sticker'){
        const img = document.createElement('img');
        img.src = msg.content; img.className = 'sticker-img';
        row.appendChild(img);
      } else {
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = msg.content;
        if(msg.quoted) bubble.innerHTML = `<div style="font-size:10px;color:#888;border-left:3px solid var(--accent);padding-left:4px;margin-bottom:4px;">${msg.quoted}</div>` + bubble.textContent;
        row.appendChild(bubble);
      }
      row.addEventListener('click',()=>{
        showMsgActions(row,msg,chat.id);
      });
      $chat.appendChild(row);
    });
    $chat.scrollTop = $chat.scrollHeight;
  }

  function showMsgActions(row,msg,chatId) {
    const existing = row.querySelector('.msg-actions');
    if(existing) { existing.remove(); return; }
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.style.cssText = 'position:absolute;top:-28px;background:var(--modal-bg);border:1px solid var(--border);border-radius:4px;padding:4px 8px;display:flex;gap:6px;font-size:11px;z-index:10;';
    actions.innerHTML = '<span data-a="quote">引用</span><span data-a="fav">收藏</span><span data-a="del">删除</span>';
    actions.querySelectorAll('span').forEach(sp=>{
      sp.addEventListener('click',(e)=>{
        e.stopPropagation();
        const act = sp.dataset.a;
        if(act==='quote'){ $input.value = '「引用：'+(msg.content||'[表情]').substring(0,20)+'」\n'+$input.value; }
        if(act==='fav'){
          if(!APP_DATA.favorites[chatId]) APP_DATA.favorites[chatId]=[];
          const idx = APP_DATA.favorites[chatId].indexOf(msg.id);
          if(idx>=0) APP_DATA.favorites[chatId].splice(idx,1);
          else APP_DATA.favorites[chatId].push(msg.id);
          saveAll().then(renderChat);
        }
        if(act==='del'){
          const msgs = getMsgs(chatId);
          const idx = msgs.findIndex(m=>m.id===msg.id);
          if(idx>=0) msgs.splice(idx,1);
          saveAll().then(renderChat);
        }
        actions.remove();
      });
    });
    row.appendChild(actions);
    setTimeout(()=>{ if(document.body.contains(actions)) actions.remove(); }, 3000);
  }

  function addMsg(chatId, msg) {
    getMsgs(chatId).push(msg);
    return saveAll();
  }

  function sendText(text, from='self') {
    const chat = getCurrentChat();
    const msg = { id:'m'+Date.now()+Math.random().toString(36), from, type:'text', content:text, time:Date.now(), quoted:null };
    return addMsg(chat.id, msg).then(()=>{
      renderChat();
      playSound(APP_DATA.settings.soundType);
      if(from==='self') scheduleReply();
    });
  }

  function sendSticker(dataUrl) {
    const chat = getCurrentChat();
    const msg = { id:'m'+Date.now()+Math.random().toString(36), from:'self', type:'sticker', content:dataUrl, time:Date.now() };
    return addMsg(chat.id, msg).then(()=>{ renderChat(); scheduleReply(); });
  }

  function scheduleReply() {
    const speed = APP_DATA.settings.replySpeed||3;
    setTimeout(()=>{
      const chat = getCurrentChat();
      const reply = tarotReply();
      const msg = { id:'m'+Date.now()+Math.random().toString(36), from:'other', type:'text', content:reply, time:Date.now() };
      addMsg(chat.id, msg).then(()=>{ renderChat(); playSound(APP_DATA.settings.soundType); });
    }, speed*1000);
  }

  function showCalendar() {
    const now = new Date(); const ym = now.getFullYear()+'-'+(now.getMonth()+1);
    if(!APP_DATA.calendarMarks[ym]) APP_DATA.calendarMarks[ym] = {marks:[],cycleDays:7};
    const cm = APP_DATA.calendarMarks[ym];
    let html = '<div style="display:flex;flex-wrap:wrap;">';
    for(let d=1; d<=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(); d++){
      html += `<span style="width:28px;height:28px;text-align:center;line-height:28px;margin:2px;background:${cm.marks.includes(d)?'#e91e63':'var(--input-bg)'};color:${cm.marks.includes(d)?'#fff':'var(--text)'};border-radius:2px;cursor:pointer;" data-day="${d}">${d}</span>`;
    }
    html += '</div><button id="cal-add">添加标记</button> <button id="cal-cycle">周期(${cm.cycleDays}天)</button> <button id="cal-del">清除当月</button>';

    modal.querySelectorAll('[data-day]').forEach(sp=>{
      sp.addEventListener('click',function(){
        const day = +this.dataset.day;
        if(cm.marks.includes(day)) cm.marks = cm.marks.filter(d=>d!==day);
        else { cm.marks.push(day); for(let i=1;i<cm.cycleDays;i++){ const nd=day+i; if(nd<=new Date(now.getFullYear(),now.getMonth()+1,0).getDate() && !cm.marks.includes(nd)) cm.marks.push(nd); } }
        saveAll().then(()=>{ closeAllModals(); showCalendar(); });
      });
    });
    modal.querySelector('#cal-add').addEventListener('click',()=>{
      const d = +prompt('日期：');
      if(d>=1 && d<=31){ cm.marks.push(d); saveAll().then(()=>{closeAllModals(); showCalendar();}); }
    });
    modal.querySelector('#cal-cycle').addEventListener('click',()=>{
      const c = +prompt('周期天数1-15：',cm.cycleDays);
      if(c>=1 && c<=15){ cm.cycleDays=c; saveAll().then(()=>{closeAllModals(); showCalendar();}); }
    });
    modal.querySelector('#cal-del').addEventListener('click',()=>{ cm.marks=[]; saveAll().then(()=>{closeAllModals(); showCalendar();}); });
  }

  let musicAudio = null;
  function getMusicAudio() {
    if(!musicAudio) { musicAudio = new Audio(); musicAudio.addEventListener('ended', playNextMusic); }
    return musicAudio;
  }
  function playMusicIndex(idx) {
    if(APP_DATA.musicList.length===0) return;
    if(idx<0) idx=APP_DATA.musicList.length-1;
    if(idx>=APP_DATA.musicList.length) idx=0;
    APP_DATA.musicCurrentIndex = idx;
    const track = APP_DATA.musicList[idx];
    const audio = getMusicAudio();
    audio.src = track.dataUrl;
    audio.play().then(()=>{ APP_DATA.musicIsPlaying=true; updateMusicMini(); }).catch(()=>{ APP_DATA.musicIsPlaying=false; });
    saveAll();
  }
  function playNextMusic() {
    const mode = APP_DATA.musicPlayMode;
    let next = APP_DATA.musicCurrentIndex;
    if(mode==='sequential') next++;
    else if(mode==='random') next = Math.floor(Math.random()*APP_DATA.musicList.length);
    else if(mode==='single') { playMusicIndex(next); return; }
    playMusicIndex(next);
  }
  function updateMusicMini() {
    $musicMini.style.display = APP_DATA.musicIsPlaying && APP_DATA.musicList.length>0 ? 'flex' : 'none';
  }
  function showMusicPlayer() {
    const track = APP_DATA.musicList[APP_DATA.musicCurrentIndex]||null;
    let html = `<p>${track?track.name:'未选择'}</p>
      <button id="mu-prev">⏮</button><button id="mu-play">${APP_DATA.musicIsPlaying?'⏸':'▶'}</button><button id="mu-next">⏭</button>
      <button id="mu-mode">${APP_DATA.musicPlayMode}</button>
      <button id="mu-add">添加歌曲</button><button id="mu-list">列表</button>`;
    const modal = showModal('音乐', html);
    modal.querySelector('#mu-prev').addEventListener('click',()=>{ playMusicIndex(APP_DATA.musicCurrentIndex-1); closeAllModals(); showMusicPlayer(); });
    modal.querySelector('#mu-play').addEventListener('click',()=>{
      const audio = getMusicAudio();
      if(APP_DATA.musicIsPlaying){ audio.pause(); APP_DATA.musicIsPlaying=false; }
      else { audio.play().catch(()=>{}); APP_DATA.musicIsPlaying=true; }
      updateMusicMini(); saveAll(); closeAllModals(); showMusicPlayer();
    });
    modal.querySelector('#mu-next').addEventListener('click',()=>{ playNextMusic(); closeAllModals(); showMusicPlayer(); });
    modal.querySelector('#mu-mode').addEventListener('click',()=>{
      const modes = ['sequential','single','random'];
      const idx = modes.indexOf(APP_DATA.musicPlayMode);
      APP_DATA.musicPlayMode = modes[(idx+1)%3];
      saveAll(); closeAllModals(); showMusicPlayer();
    });
    modal.querySelector('#mu-add').addEventListener('click',()=>{
      const inp = document.createElement('input'); inp.type='file'; inp.accept='audio/*'; inp.multiple=true;
      inp.onchange = (e)=>{
        const files = Array.from(e.target.files);
        files.forEach(file=>{
          const reader = new FileReader();
          reader.onload = ()=>{ APP_DATA.musicList.push({name:file.name, dataUrl:reader.result}); saveAll(); };
          reader.readAsDataURL(file);
        });
        closeAllModals(); showMusicPlayer();
      };
      inp.click();
    });
    modal.querySelector('#mu-list').addEventListener('click',()=>{
      closeAllModals();
      let listHtml = APP_DATA.musicList.map((t,i)=>`<div style="display:flex;justify-content:space-between;"><span class="play-music" data-mi="${i}">${t.name}</span><span class="del-music" data-mi="${i}" style="color:#c0392b;">删除</span></div>`).join('');
      const m2 = showModal('歌曲列表', listHtml);
      m2.querySelectorAll('.play-music').forEach(el=>{ el.addEventListener('click',()=>{ playMusicIndex(+el.dataset.mi); closeAllModals(); }); });
      m2.querySelectorAll('.del-music').forEach(el=>{ el.addEventListener('click',(e)=>{ e.stopPropagation(); APP_DATA.musicList.splice(+el.dataset.mi,1); saveAll().then(()=>{closeAllModals(); showMusicPlayer();}); }); });
    });
  }

  function makeCall() {
    if(APP_DATA.callActive) return;
    APP_DATA.callActive = true; APP_DATA.callChatId = APP_DATA.currentChatId; APP_DATA.callStartTime = Date.now();
    let html = `<p>拨号中...</p><button id="call-hangup">挂断</button>`;
    const modal = showModal('电话', html);
    const answered = Math.random()>0.3;
    let timer;
    if(answered) setTimeout(()=>{
      modal.querySelector('p').textContent='已接通';
      APP_DATA.callStartTime = Date.now();
      timer = setInterval(()=>{
        const sec = Math.floor((Date.now()-APP_DATA.callStartTime)/1000);
        modal.querySelector('p').textContent = `通话 ${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
      },500);
    }, 2000);
    setTimeout(()=>{ endCall(answered?'通话':'对方未接听'); }, 30000);
    function endCall(result) {
      clearInterval(timer);
      const duration = result==='通话' ? (()=>{ const s = Math.floor((Date.now()-APP_DATA.callStartTime)/1000); return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0'); })() : null;
      const msg = { id:'m'+Date.now(), from:'system', type:'call', callResult:result, callDuration:duration, time:Date.now() };
      addMsg(APP_DATA.callChatId, msg).then(renderChat);
      APP_DATA.callActive = false; closeAllModals(); $callMini.style.display='none';
    }
    modal.querySelector('#call-hangup').addEventListener('click',()=> endCall('已拒绝'));
  }

  // ========== 事件绑定 ==========
  document.getElementById('other-avatar').addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=()=>{ getCurrentChat().otherAvatar=r.result; saveAll().then(renderTopbar); }; r.readAsDataURL(f); } }; inp.click(); });
  document.getElementById('other-nick').addEventListener('click',()=>{ const n=prompt('昵称：',getCurrentChat().otherNick); if(n){ getCurrentChat().otherNick=n; saveAll().then(renderTopbar); } });
  document.getElementById('other-status').addEventListener('click',()=>{ const s=prompt('状态：',getCurrentChat().otherStatus); if(s){ getCurrentChat().otherStatus=s; saveAll().then(renderTopbar); } });
  document.getElementById('self-avatar').addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=()=>{ getCurrentChat().selfAvatar=r.result; saveAll().then(renderTopbar); }; r.readAsDataURL(f); } }; inp.click(); });
  document.getElementById('self-nick').addEventListener('click',()=>{ const n=prompt('昵称：',getCurrentChat().selfNick); if(n){ getCurrentChat().selfNick=n; saveAll().then(renderTopbar); } });
  document.getElementById('self-status').addEventListener('click',()=>{ const s=prompt('状态：',getCurrentChat().selfStatus); if(s){ getCurrentChat().selfStatus=s; saveAll().then(renderTopbar); } });
  document.getElementById('btn-settings').addEventListener('click', showSettings);
  document.getElementById('btn-newchat').addEventListener('click', showChatManager);
  document.getElementById('btn-calendar').addEventListener('click', showCalendar);
  document.getElementById('btn-music').addEventListener('click', showMusicPlayer);
  document.getElementById('btn-xiaoliu').addEventListener('click', showXiaoLiu);
  document.getElementById('btn-favorites').addEventListener('click', ()=>{
    const favs = APP_DATA.favorites[APP_DATA.currentChatId] || [];
    const msgs = getMsgs(APP_DATA.currentChatId);
    const html = favs.map(fid=>{ const m=msgs.find(m=>m.id===fid); return m?`<div>${m.content||'[表情]'}</div>`:''; }).join('');
    showModal('收藏', html||'暂无收藏');
  });
  document.getElementById('btn-call').addEventListener('click', makeCall);
  document.getElementById('btn-letters').addEventListener('click', showLetters);
  document.getElementById('btn-stickers').addEventListener('click', showStickers);
  document.getElementById('btn-dots').addEventListener('click', ()=>{ scheduleReply(); });
  document.getElementById('send-btn').addEventListener('click', ()=>{
    const text = $input.value.trim();
    if(text){ sendText(text); $input.value=''; }
  });
  $input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('send-btn').click(); } });

  function renderAll() { renderTopbar(); renderChat(); updateMusicMini(); }
  function checkPassword() {
    if(APP_DATA.passwordEnabled) {
      document.getElementById('password-screen').style.display='flex';
      document.getElementById('app').style.display='none';
    } else {
      document.getElementById('password-screen').style.display='none';
      document.getElementById('app').style.display='flex';
    }
  }
  document.getElementById('pwd-submit').addEventListener('click',()=>{
    if(document.getElementById('pwd-input').value === APP_DATA.password){
      document.getElementById('password-screen').style.display='none';
      document.getElementById('app').style.display='flex';
    } else alert('密码错误');
  });

  // 初始化
  openDB().then(()=> loadAll()).then(()=>{
    checkPassword();
    renderAll();
    // 状态刷新定时器
    setInterval(()=>{
      const statuses = ['在线','忙碌','离开','隐身'];
      getCurrentChat().otherStatus = statuses[Math.floor(Math.random()*statuses.length)];
      saveAll().then(renderTopbar);
    }, 2*3600000 + Math.random()*7200000);
    // 随机来电模拟
    setInterval(()=>{
      if(!APP_DATA.callActive && document.hidden===false && Math.random()<0.1) makeCall();
    }, 600000);
  }).catch(e=>{
    console.error(e);
    // 降级使用localStorage
    try{ const saved = localStorage.getItem('jzj_backup'); if(saved) APP_DATA = JSON.parse(saved); }catch(e2){}
    if(!APP_DATA.chatInterfaces.length) APP_DATA.chatInterfaces = [createDefaultChat()];
    APP_DATA.currentChatId = APP_DATA.chatInterfaces[0].id;
    checkPassword();
    renderAll();
  });

  window.addEventListener('beforeunload', ()=>{
    try{ localStorage.setItem('jzj_backup', JSON.stringify(APP_DATA)); }catch(e){}
    saveAll();
  });
})();
</script>
</body>
</html>
